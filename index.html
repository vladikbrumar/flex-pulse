<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flex Pulse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one iPhone-width app shell over a soft ambient backdrop; glass cards; a floating capsule tab bar. Each tab maps to a SwiftUI view later. */
:root {
  --accent-l: #D9480F; --accent-d: #FF7A3D; --accent2-l: #E64980; --accent2-d: #F783AC;
  --accent: var(--accent-l);
  --accent-2: var(--accent2-l);
  --on-accent: #FFFFFF;
  --bg: #EEF0F4;
  --surface: #FFFFFF;
  --surface-2: rgba(120, 128, 145, 0.10);
  --glass: rgba(255, 255, 255, 0.58);
  --glass-strong: rgba(255, 255, 255, 0.80);
  --glass-edge: rgba(255, 255, 255, 0.85);
  --glass-shadow: 0 8px 28px rgba(30, 40, 70, 0.10), 0 1px 2px rgba(30, 40, 70, 0.06);
  --fg: #14161B;
  --muted: #4A515C;
  --hair: rgba(20, 30, 50, 0.10);
  --good: #18864A; --warn: #B7791F; --bad: #C4302B;
  --ph-drive: #8C95A5; --ph-load: #DDA015; --ph-return: #BCC3CE;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: var(--accent-d); --accent-2: var(--accent2-d); --on-accent: #120A05;
    --bg: #0B0C10; --surface: #1A1C22; --surface-2: rgba(255, 255, 255, 0.07);
    --glass: rgba(30, 32, 40, 0.52); --glass-strong: rgba(34, 36, 44, 0.82); --glass-edge: rgba(255, 255, 255, 0.14);
    --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.3);
    --fg: #F2F3F5; --muted: #9DA3AE; --hair: rgba(255, 255, 255, 0.10);
    --good: #45CB82; --warn: #F2C14E; --bad: #FF6B66;
    --ph-drive: #6E7889; --ph-load: #F2C14E; --ph-return: #4A5262;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: var(--accent-d); --accent-2: var(--accent2-d); --on-accent: #120A05;
  --bg: #0B0C10; --surface: #1A1C22; --surface-2: rgba(255, 255, 255, 0.07);
  --glass: rgba(30, 32, 40, 0.52); --glass-strong: rgba(34, 36, 44, 0.82); --glass-edge: rgba(255, 255, 255, 0.14);
  --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.3);
  --fg: #F2F3F5; --muted: #9DA3AE; --hair: rgba(255, 255, 255, 0.10);
  --good: #45CB82; --warn: #F2C14E; --bad: #FF6B66;
  --ph-drive: #6E7889; --ph-load: #F2C14E; --ph-return: #4A5262;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(55% 38% at 12% 6%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 72%),
    radial-gradient(45% 32% at 92% 24%, color-mix(in srgb, var(--accent-2) 24%, transparent), transparent 72%),
    radial-gradient(60% 40% at 30% 70%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 75%),
    radial-gradient(50% 35% at 85% 95%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 75%),
    var(--bg); }

.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge); border-radius: var(--r); }
:root[data-glass="off"] .glass { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; border-color: var(--hair); box-shadow: none; }
:root[data-glass="off"] .ambient { background: var(--bg); }
@media (prefers-reduced-transparency: reduce) { .glass { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; } }

.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(112px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 22px; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 28px; padding-top: 6px; }
.topline .date { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.pill { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); white-space: nowrap; }
h1 { font-family: var(--font-round); font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: -14px 0 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 10px 6px; display: flex; justify-content: space-between; gap: 8px; }
h2 span:last-child:not(:first-child) { text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
section { display: flex; flex-direction: column; min-width: 0; }
.neg { color: var(--bad); }
.foot { color: var(--muted); font-size: 13px; margin: 10px 6px 0; }
.muted { color: var(--muted); }

.btn { border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 650; background: var(--surface-2); color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 1px 0 rgba(255,255,255,0.35); }
.btn.glassy { background: var(--glass-strong); border: 1px solid var(--glass-edge); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.btn.danger { background: transparent; color: var(--bad); }
.btn.block { width: 100%; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.btn.big { padding: 18px; font-size: 17px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 0; }
@media (prefers-reduced-motion: no-preference) { .btn, .seg button, .tabbar button, .card { transition: transform 0.15s ease, background-color 0.2s ease; } .btn:active, .card:active { transform: scale(0.98); } }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; gap: 4px; border-radius: 999px; }
.seg button { border: 0; background: transparent; padding: 8px 6px; border-radius: 999px; font-size: 13px; font-weight: 650; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--fg); box-shadow: 0 2px 8px rgba(0,0,0,0.12), inset 0 1px 0 var(--glass-edge); }

.welcome { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.welcome strong { font-family: var(--font-round); font-size: 19px; }
.welcome p { margin: 0; color: var(--muted); font-size: 14px; }

.hero { padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 16px; }
.hero .k { color: var(--muted); font-size: 13px; font-weight: 650; }
.hero .big { font-family: var(--font-round); font-size: 48px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 4px; }
.split { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.split span { display: block; height: 100%; }
.bridge { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 10px; font-size: 15px; align-items: center; }
.bridge .sw { width: 10px; height: 10px; border-radius: 3px; }
.bridge .v { text-align: right; font-variant-numeric: tabular-nums; }
.bridge .total { border-top: 1px solid var(--hair); padding-top: 8px; font-weight: 750; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { color: var(--muted); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; }
.tile .v { font-family: var(--font-round); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .s { color: var(--muted); font-size: 12px; }
.tile .meter { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.tile .meter span { display: block; height: 100%; border-radius: 4px; }

.bars { padding: 16px 12px 12px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 180px; }
.bars.six { grid-template-columns: repeat(6, 1fr); }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; height: 100%; min-width: 0; }
.bar .fill { width: 66%; max-width: 30px; background: linear-gradient(to top, color-mix(in srgb, var(--accent) 70%, transparent), var(--accent)); border-radius: 8px 8px 4px 4px; min-height: 3px; }
.bar .fill.cost { background: linear-gradient(to top, color-mix(in srgb, var(--accent-2) 65%, transparent), var(--accent-2)); }
.bar .fill.neg { background: var(--bad); }
.bar .fill.zero { background: var(--hair); }
.bar .amt { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar .day { font-size: 12px; color: var(--muted); font-weight: 650; }
.bar.today .day { color: var(--accent); }

/* Live block */
.live { padding: 18px; display: flex; flex-direction: column; gap: 16px; border: 1.5px solid color-mix(in srgb, var(--accent) 60%, transparent) !important; box-shadow: 0 10px 34px color-mix(in srgb, var(--accent) 22%, transparent), inset 0 1px 0 var(--glass-edge) !important; }
.live .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.live .tag { color: var(--accent); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
.live .meta { color: var(--muted); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .dot { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: 0.25; } }
.timers { display: grid; grid-template-columns: 1.25fr 1fr; gap: 10px; }
.timer { background: var(--surface-2); border-radius: 18px; padding: 12px 14px; min-width: 0; }
.timer .k { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.timer .clock { font-family: var(--font-num); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 2px; }
.timer .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.timer.off .clock { color: var(--muted); }
.timer.route { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.livegrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.livegrid > div { background: var(--surface-2); border-radius: 14px; padding: 9px 10px; min-width: 0; }
.livegrid .k { font-size: 10.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.livegrid .v { font-family: var(--font-round); font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; position: relative; padding-bottom: 12px; }
.steps li:last-child { padding-bottom: 0; }
.steps li::before { content: ""; position: absolute; left: 10px; top: 18px; bottom: -2px; width: 2px; background: var(--hair); }
.steps li:last-child::before { display: none; }
.steps li.done::before { background: color-mix(in srgb, var(--accent) 55%, transparent); }
.steps .mk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hair); background: var(--glass-strong); display: grid; place-items: center; position: relative; z-index: 1; }
.steps li.done .mk { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.steps li.done .mk svg { width: 12px; height: 12px; }
.steps li.skip .mk { border-style: dashed; }
.steps li.next .mk { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.steps .lb { font-size: 14px; font-weight: 600; padding-top: 1px; }
.steps li.todo .lb, .steps li.skip .lb { color: var(--muted); font-weight: 500; }
.steps .lb small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.steps .tm { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; white-space: nowrap; }
.action { background: var(--surface-2); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.action .title { font-family: var(--font-round); font-weight: 800; font-size: 17px; }
.inline { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.inline label { font-size: 14px; font-weight: 600; }
.inline label small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.inline input { border: 1px solid var(--hair); background: var(--glass-strong); border-radius: 12px; padding: 10px 12px; width: 140px; text-align: right; font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 650; }
.inline input.sm { width: 92px; font-size: 16px; }
.linkrow { display: flex; justify-content: space-between; gap: 10px; }
.linkbtn { border: 0; background: var(--surface-2); color: var(--fg); font-weight: 650; padding: 7px 14px; border-radius: 999px; font-size: 14px; }
.confirm { background: var(--surface-2); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sumgrid { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }

/* Block cards */
.daygroup { display: flex; flex-direction: column; gap: 10px; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px; }
.dayhead b { font-family: var(--font-round); font-size: 17px; }
.dayhead span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.card { width: 100%; text-align: left; padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; color: var(--fg); }
.card .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.card .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card .who b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .who span { color: var(--muted); font-size: 13px; }
.card .amt { text-align: right; flex-shrink: 0; }
.card .amt b { font-family: var(--font-round); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.card .amt span { color: var(--muted); font-size: 12px; }
.timeline { display: flex; height: 8px; border-radius: 5px; overflow: hidden; gap: 2px; }
.timeline span { display: block; height: 100%; border-radius: 3px; min-width: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 650; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--fg); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.chip.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.chip.tip { background: color-mix(in srgb, var(--accent-2) 16%, transparent); color: var(--accent-2); }
.chip.surge { background: var(--accent); color: var(--on-accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

/* Expenses */
.elist { overflow: hidden; }
.erow { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: none; border: 0; border-top: 1px solid var(--hair); text-align: left; color: var(--fg); }
.erow:first-child { border-top: 0; }
.erow:active { background: var(--surface-2); }
.icon { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35); }
.icon svg { width: 20px; height: 20px; }
.erow .mid { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.erow .mid b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.erow .mid span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.erow .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.erow .v small { display: block; font-weight: 600; font-size: 11px; color: var(--muted); }
.costcard { padding: 16px; display: grid; grid-template-columns: 148px 1fr; gap: 16px; align-items: center; }
@media (max-width: 380px) { .costcard { grid-template-columns: 1fr; justify-items: center; } }
.donut { width: 148px; height: 148px; }
.donut text { fill: var(--fg); }
.donut .sub { fill: var(--muted); }
.costlegend { display: flex; flex-direction: column; gap: 7px; font-size: 13px; min-width: 0; width: 100%; }
.costlegend div { display: grid; grid-template-columns: 10px 1fr auto; gap: 7px; align-items: center; }
.costlegend i { width: 10px; height: 10px; border-radius: 3px; }
.costlegend span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.costlegend b { font-variant-numeric: tabular-nums; }
.costlegend .est { color: var(--muted); font-weight: 500; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { border: 1px solid var(--hair); background: var(--glass-strong); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 650; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.fchip i { width: 8px; height: 8px; border-radius: 50%; }
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.taxcard { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.taxcard .row2 { display: flex; flex-direction: column; gap: 7px; font-size: 15px; }
/* key/value rows: one flex row each, so rules and totals run edge to edge */
.kvr { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-width: 0; }
.kvr > span:first-child { min-width: 0; }
.kvr .n { text-align: right; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.kvr.tot { border-top: 1px solid var(--hair); padding-top: 8px; margin-top: 2px; font-weight: 750; }
.kvr.tot .n { font-weight: 800; }
.kvr.strong .n { font-family: var(--font-round); font-size: 19px; color: var(--accent); }
.sumgrid .hd, .taxcard .hd { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 8px; }
.sumgrid .hd:first-child, .taxcard .hd:first-child { margin-top: 0; }

/* Guides and mileage */
.guide { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent) !important; background: color-mix(in srgb, var(--accent) 7%, var(--glass)) !important; }
.guide .gt { display: flex; align-items: center; gap: 8px; font-weight: 750; font-size: 15px; color: var(--accent); }
.guide .gt svg { width: 18px; height: 18px; flex-shrink: 0; }
.guide ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--fg); }
.guide li::marker { color: var(--accent); }
.milehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hero .mid { font-family: var(--font-round); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 4px; }
.unit { font-size: 0.45em; font-weight: 700; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.mrow { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: none; border: 0; border-top: 1px solid var(--hair); text-align: left; color: var(--fg); }
.mrow:first-child { border-top: 0; }
.mrow:active { background: var(--surface-2); }
.mtop { display: flex; align-items: center; gap: 12px; width: 100%; }
.mtop .mid { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mtop .mid b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mtop .mid span { color: var(--muted); font-size: 13px; }

      ['to_station', 'route', 'home'].forEach(k => { const m = Number(l[k]) || 0; out.miles[k] += m; if (S().taxLegs[k]) out[k] += m * r; });
      const u = (Number(l.unsplit) || 0) + (Number(l.between) || 0); out.miles.unsplit += u; out.unsplit += u * r;
    });
    out.total = out.to_station + out.route + out.home + out.unsplit;
    return out;
  }
  function periodStats(days) {
    const blocks = state.blocks.filter(b => inRange(b.start, days));
    const [from, to] = periodBounds(days);
    let ex = 0, prorated = false, coveredLogged = false;
    state.expenses.forEach(e => {
      if (!expenseCounts(e)) { if (inRange(e.date, days)) coveredLogged = true; return; }
      const v = expenseShare(e, from, to); if (v > 0) { ex += v; if (e.seriesId) prorated = true; }
    });
    const g = blocks.reduce((a, b) => a + gross(b), 0);
    const miles = blocks.reduce((a, b) => a + blockMiles(b), 0);
    const veh = vehicleCost(miles);
    const mins = blocks.reduce((a, b) => a + basisMins(b.mins, S().basis), 0);
    const ded = taxDeduction(blocks);
    const stdExtra = state.expenses.filter(e => inRange(e.date, days) && (CATS[e.category] || CATS.Other).tax === 'extra').reduce((a, e) => a + Number(e.amount || 0), 0);
    return { count: blocks.length, gross: g, tips: blocks.reduce((a, b) => a + Number(b.tips || 0), 0), miles, veh, ex, net: g - veh - ex, mins, deduction: ded.total, prorated, coveredLogged, setAside: Math.max(0, g - ded.total - stdExtra) * (Number(S().taxPct) || 0) / 100 };
  }
  function legTotals(blocks) {
    const t = { to_station: 0, route: 0, home: 0, other: 0 };
    blocks.forEach(b => { const l = b.legs || { unsplit: Number(b.miles) || 0 }; t.to_station += Number(l.to_station) || 0; t.route += Number(l.route) || 0; t.home += Number(l.home) || 0; t.other += (Number(l.unsplit) || 0) + (Number(l.between) || 0); });
    t.total = t.to_station + t.route + t.home + t.other;
    return t;
  }

  // ---------- formatting ----------
  const money = (n, dp) => { const v = Number(n) || 0; const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dp === 0 ? 0 : 2, maximumFractionDigits: dp === 0 ? 0 : 2 }); return (v < 0 ? '−$' : '$') + s; };
  const num1 = (n) => Math.round((Number(n) || 0) * 10) / 10;
  const mi = (n) => { const v = num1(n); return v.toLocaleString('en-US') + ' ' + plural(v, 'mile'); };
  const perHr = (v, dp) => money(v, dp) + L('/hr');
  const perMi = (v) => money(v) + L('/mi');
  const dur = (mins) => { const m = Math.round(mins); const h = Math.floor(m / 60); const mm = String(m % 60).padStart(2, '0'); return lang === 'uk' ? (h ? `${h} год ${mm} хв` : `${m} хв`) : (h ? `${h}h ${mm}m` : `${m}m`); };
  const hrs = (h) => (lang === 'uk' ? `${h} год` : `${h}h`);
  const clock = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; };
  const dayKey = (d) => new Date(d).toDateString();
  const dayLabel = (d) => { const x = new Date(d), t = new Date(); const diff = Math.round((new Date(t.toDateString()) - new Date(x.toDateString())) / DAY); if (diff === 0) return L('Today'); if (diff === 1) return L('Yesterday'); return cap(x.toLocaleDateString(loc(), { weekday: 'long', month: 'short', day: 'numeric' })); };
  const shortDay = (d) => { const x = new Date(d), t = new Date(); const diff = Math.round((new Date(t.toDateString()) - new Date(x.toDateString())) / DAY); if (diff === 0) return L('Today'); if (diff === 1) return L('Yesterday'); return cap(x.toLocaleDateString(loc(), { weekday: 'short', month: 'short', day: 'numeric' })); };
  const timeLabel = (d) => new Date(d).toLocaleTimeString(loc(), { hour: 'numeric', minute: '2-digit' });
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toLocalInput = (v) => { if (!v) return ''; const d = new Date(v); const off = d.getTimezoneOffset() * 60000; return new Date(d - off).toISOString().slice(0, 16); };
  const fromLocalInput = (v) => (v ? new Date(v).toISOString() : null);
  const hasSample = () => ['blocks', 'expenses', 'places', 'stations', 'recurring', 'scheduled'].some(k => state[k].some(x => x.sample));
  const catIcon = (name) => { const c = CATS[name] || CATS.Other; return `<span class="icon" style="background:${c.c}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${c.i}</svg></span>`; };
  const kv = (l, v, cls) => `<div class="kvr ${cls || ''}"><span>${l}</span><span class="n">${v}</span></div>`;
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
  function choices(attr, current, opts, label) {
    return `<div class="glass choices" role="radiogroup" aria-label="${esc(label)}">${Object.entries(opts).map(([k, o]) => `<button type="button" class="choice" role="radio" data-${attr}="${k}" aria-checked="${current === k}"><span class="rd">${current === k ? CHECK : ''}</span><span><b>${L(o.name)}</b>${o.desc ? `<span class="d">${L(o.desc)}</span>` : ''}</span></button>`).join('')}</div>`;
  }

  // ---------- shell ----------
  const app = document.getElementById('app');
  const scrim = document.getElementById('scrim');
  const tabsEl = document.getElementById('tabs');
  const ICONS = {
    today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
    blocks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
    money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/></svg>',

  };
  const TABS = [['today', T('Today')], ['blocks', T('Blocks')], ['money', T('Money')], ['places', T('Places')], ['settings', T('Settings')]];
  function renderTabs() {
    tabsEl.innerHTML = TABS.map(([id, name]) => `<button type="button" data-tab="${id}" ${state.ui.tab === id ? 'aria-current="page"' : ''}><span class="${id === 'today' && state.active ? 'livebadge' : ''}">${ICONS[id]}</span>${L(name)}</button>`).join('');
  }
  tabsEl.addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (!b) return; state.ui.tab = b.dataset.tab; persistLocal(); render(); window.scrollTo(0, 0); haptic('light'); });
  function header(title) {
    const d = cap(new Date().toLocaleDateString(loc(), { weekday: 'long', month: 'long', day: 'numeric' }));
    return `<div class="topline"><span class="date">${esc(d)}</span>${hasSample() ? `<span class="pill">${L('Sample data')}</span>` : ''}</div><h1>${title}</h1>`;
  }
  let lastTab = null;
  function render() {
    renderTabs();
    if (state.ui.tab !== lastTab) { app.classList.add('enter'); setTimeout(() => app.classList.remove('enter'), 450); lastTab = state.ui.tab; }
    const t = state.ui.tab;

  function refresh() { applyAppearance(); render(); }

  // ---------- Today ----------
  const RANGES = [['today', T('Today')], [7, T('7 days')], [30, T('30 days')], [0, T('All time')]];
  function moreBox(id, title, inner) {
    const open = !!state.ui.more && !!state.ui.more[id];
    return `<details class="morebox" data-more="${id}" ${open ? 'open' : ''}><summary><span>${title}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></summary><div class="morebody">${inner}</div></details>`;
  }
  function renderToday() {
    const r = state.ui.range; const st = periodStats(r); const basis = S().basis;
    let html = header(L('Today'));
    if (!state.ui.welcomed && hasSample()) {
      html += `<section><div class="glass welcome"><strong>${L('Welcome to Flex Pulse')}</strong><p>${L("You're looking at example blocks, expenses and places so you can see how it works. Your own data stays on your phone and in your own Telegram backup. Nobody else can see it.")}</p><div class="btnrow"><button class="btn primary" type="button" data-act="fresh">${L('Start fresh')}</button><button class="btn glassy" type="button" data-act="keep-sample">${L('Explore the example')}</button></div></div></section>`;
    }
    html += state.active ? liveCard() : `<section><button class="btn primary block big" type="button" data-act="start">${L('Start a block')}</button><p class="foot">${L('Tap when you leave home. The app walks you through the station, your route, and back.')}</p></section>`;
    const keep = Math.max(0, st.net); const tot = Math.max(1, keep + st.veh + st.ex);
    const title = r === 'today' ? L('You kept today') : r ? L('You kept, last {n} days', { n: r }) : L('You kept, all time');
    const notes = [];
    if (!V().customized) notes.push(`<button type="button" class="pillbtn" data-go="settings:car">${L('Using typical car costs · Set yours')}</button>`);
    if (st.coveredLogged) notes.push(`<div class="hnote">${L('A tank of gas covers many blocks, so each block is charged only for the miles it drove.')}</div>`);
    if (st.prorated) notes.push(`<div class="hnote">${L('Monthly bills are spread evenly over each month.')}</div>`);
    html += `<section><div class="seg glass" role="group" aria-label="${L('Period')}">${RANGES.map(([v, n]) => `<button type="button" data-range="${v}" aria-pressed="${r === v}">${L(n)}</button>`).join('')}</div>
      <div class="glass hero" style="margin-top:12px"><div><div class="k">${title}</div><div class="big ${st.count && st.net < 0 ? 'neg' : ''}">${money(st.count ? st.net : 0)}</div></div>
      ${st.count ? `<div class="split" role="img" aria-label="${L('Where your pay went')}"><span style="width:${keep / tot * 100}%;background:var(--good)"></span><span style="width:${st.veh / tot * 100}%;background:var(--ph-drive)"></span><span style="width:${st.ex / tot * 100}%;background:var(--accent-2)"></span></div>
      <div class="bridge">
        <span></span><span>${L('Pay and tips · {n} {blocks}', { n: st.count, blocks: plural(st.count, 'block') })}</span><span class="v">${money(st.gross)}</span>
        <i class="sw" style="background:var(--ph-drive)"></i><span>${L('Car cost · {mi}', { mi: mi(st.miles) })}</span><span class="v">−${money(st.veh)}</span>
        ${st.ex >= 0.005 ? `<i class="sw" style="background:var(--accent-2)"></i><span>${L('Other expenses')}</span><span class="v">−${money(st.ex)}</span>` : ''}
        <i class="sw" style="background:var(--good)"></i><span class="total">${L('You kept')}</span><span class="v total">${money(st.net)}</span>
      </div>` : `<div class="hnote">${r === 'today' ? L('No blocks today yet. Your money shows up here after your first block.') : L('No blocks in this period yet.')}</div>${st.ex >= 0.005 ? `<div class="hnote">${L('Bills and expenses in this period: {v}. They come off what you make once you drive.', { v: money(st.ex) })}</div>` : ''}`}
      ${notes.join('')}</div></section>`;
    html += hoursMini();
    html += comingUp(2);
    const hr = perHour(st.net, st.mins); const goal = Number(S().goal) || 0; const rc = rateClass(hr);
    const meter = rc === 'good' ? 'var(--good)' : rc === 'warn' ? 'var(--warn)' : rc === 'bad' ? 'var(--bad)' : 'var(--accent)';
    const details = `<div class="tiles">
      <div class="glass tile"><span class="k">${L('Per hour')}</span><span class="v">${money(hr)}</span><span class="s">${goal ? (hr >= goal ? L('Above your {g} goal', { g: money(goal, 0) }) : L('Below your {g} goal', { g: money(goal, 0) })) : L(BASIS[basis].name)}</span>${goal ? `<span class="meter"><span style="width:${Math.min(100, hr / goal * 100)}%;background:${meter}"></span></span>` : ''}</div>
      <div class="glass tile"><span class="k">${L('Per mile')}</span><span class="v">${money(st.miles ? st.net / st.miles : 0)}</span><span class="s">${L('{mi} driven', { mi: mi(st.miles) })}</span></div>
      <div class="glass tile"><span class="k">${L('Before costs, per hour')}</span><span class="v">${money(perHour(st.gross, st.mins))}</span><span class="s">${dur(st.mins)}</span></div>
      <div class="glass tile"><span class="k">${L('Put aside for taxes')}</span><span class="v">${money(st.setAside, 0)}</span><span class="s">${L('{pct}% of profit after deductions', { pct: S().taxPct })}</span></div>
    </div><h2 style="margin-top:18px"><span>${L('Kept per day')}</span><span>${L('last 7 days')}</span></h2>${dayBars()}`;

  }
  function dayBars() {
    const days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push(d); }
    const vals = days.map(d => {
      const end = +d + DAY;
      const bl = state.blocks.filter(b => { const t = Date.parse(b.start); return t >= +d && t < end; });
      const ex = state.expenses.filter(e => !e.blockId && expenseCounts(e)).reduce((a, e) => a + expenseShare(e, +d, end), 0);
      return bl.reduce((a, b) => a + blockNet(b), 0) - ex;
    });
    const max = Math.max(1, ...vals.map(Math.abs));
    return `<div class="glass bars" role="img" aria-label="${L('Money kept on each of the last 7 days')}">${days.map((d, i) => {
      const v = vals[i]; const h = Math.round(Math.abs(v) / max * 100);
      return `<div class="bar ${i === 6 ? 'today' : ''}"><span class="amt">${Math.abs(v) >= 0.5 ? money(v, 0) : ''}</span><span class="fill ${v < 0 ? 'neg' : Math.abs(v) < 0.5 ? 'zero' : ''}" style="height:${Math.abs(v) >= 0.5 ? Math.max(h * 0.78, 3) : 2}%"></span><span class="day">${esc(cap(d.toLocaleDateString(loc(), { weekday: 'narrow' })))}</span></div>`;
    }).join('')}</div>`;
  }

  // ---------- areas (towns, neighborhoods, ZIP codes a block went to) ----------
  // state.areas = [{ id, name, key, aliases[], kind: 'manual' | 'gps', created, sample? }]
  // block.areas = [{ id, src: 'manual' | 'gps' }]  (ids, so renaming and merging touch one record)
  const AREA_MAX = 6;
  function areaKey(s) { return String(s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  function normName(s) { return String(s || '').replace(/\s+/g, ' ').trim().slice(0, 40); }
  const areaById = (id) => state.areas.find(a => a.id === id);
  const blockAreaIds = (b) => [...new Set((b && b.areas || []).map(x => x.id))].filter(id => areaById(id));
  const areaNames = (b) => blockAreaIds(b).map(id => areaById(id).name);
  function findArea(name, exceptId) {
    const k = areaKey(name); if (!k) return null;
    return state.areas.find(a => a.id !== exceptId && a.key === k) || state.areas.find(a => a.id !== exceptId && (a.aliases || []).includes(k)) || null;
  }
  // A name now in use as a visible name is removed from every other area's old names
  function releaseAlias(key, ownerId) { state.areas.forEach(a => { if (a.id !== ownerId && a.aliases && a.aliases.includes(key)) a.aliases = a.aliases.filter(k => k !== key); }); }
  function createArea(name) {
    const a = { id: 'a-' + uid(), name: normName(name), key: areaKey(name), aliases: [], kind: 'manual', created: new Date().toISOString() };
    releaseAlias(a.key, a.id); state.areas.push(a); return a;
  }
  function areaStats() {
    if (_cache.areaStats) return _cache.areaStats;
    const st = {}; const now = Date.now();
    state.blocks.forEach(b => {
      const t = Date.parse(b.start) || 0;
      blockAreaIds(b).forEach(id => {
        const s = st[id] || (st[id] = { n: 0, n90: 0, last: 0, by: {} });
        s.n++; if (t > now - 90 * DAY) s.n90++; s.last = Math.max(s.last, t);
        if (b.stationId) s.by[b.stationId] = (s.by[b.stationId] || 0) + 1;
      });
    });
    return (_cache.areaStats = st);
  }
  // Suggestion order: last block's areas, then this station's, then most used lately, then the rest.
  // One-off names unused for 30 days drop out of suggestions (typos age out) but stay under More.
  function areaSuggest(stationId) {
    const st = areaStats(); const now = Date.now();
    const usable = state.areas.filter(a => st[a.id] || Date.parse(a.created || 0) > now - DAY);
    const s = (a) => st[a.id] || { n: 0, n90: 0, last: Date.parse(a.created || 0) || 0, by: {} };
    const aged = (a) => s(a).n <= 1 && s(a).last < now - 30 * DAY;
    const lastB = [...state.blocks].filter(b => blockAreaIds(b).length).sort((x, y) => Date.parse(y.start) - Date.parse(x.start))[0];
    const pool = usable.filter(a => !aged(a)).sort((x, y) =>
      ((s(y).by[stationId] ? 1 : 0) - (s(x).by[stationId] ? 1 : 0)) || (s(y).n90 - s(x).n90) || (s(y).n - s(x).n) || (s(y).last - s(x).last));
    const top = [...new Set([...(lastB ? blockAreaIds(lastB) : []), ...pool.map(a => a.id)])].slice(0, AREA_MAX);
    const rest = usable.filter(a => !top.includes(a.id)).sort((x, y) => x.name.localeCompare(y.name)).map(a => a.id);
    return { top, rest };
  }

  // One picker used in the block summary ('sum') and the block edit sheet ('edit').
  const AP = { order: {}, all: {} };
  let sheetAreas = [], sheetDraft = '', sheetStation = '', sheetToken = '';
  const apSel = (ctx) => ctx === 'sum' ? (state.active.areas = state.active.areas || []) : sheetAreas;
  const apDraft = (ctx) => ctx === 'sum' ? (state.active.areaDraft || '') : sheetDraft;
  function apSetDraft(ctx, v) { if (ctx === 'sum') state.active.areaDraft = v; else sheetDraft = v; }
  function apOrder(ctx) {
    const token = ctx === 'sum' ? state.active.ms.home_end || 'x' : sheetToken;
    if (ctx === 'sum' && state.active.apOrder && state.active.apOrder.token === token) AP.order.sum = state.active.apOrder;
    if (!AP.order[ctx] || AP.order[ctx].token !== token) {
      AP.order[ctx] = Object.assign({ token }, areaSuggest(ctx === 'sum' ? state.active.stationId : sheetStation)); AP.all[ctx] = false;
      if (ctx === 'sum') state.active.apOrder = AP.order.sum;
    }
    return AP.order[ctx];
  }
  function apMatches(ctx) {
    const dk = areaKey(apDraft(ctx)); if (!dk) return [];
    return state.areas.filter(a => a.key.includes(dk) || (a.aliases || []).some(k => k.includes(dk)));
  }
  // What Add (or Save) would do with the typed text: choose an existing area, or make a new one
  function apChoice(ctx) {
    const name = normName(apDraft(ctx)); if (!name) return null;
    return findArea(name);
  }
  function apChip(ctx, id) {
    const a = areaById(id); if (!a) return '';
    const on = apSel(ctx).some(x => x.id === id);
    return `<button type="button" class="achip" data-apchip="${id}" data-apctx="${ctx}" aria-pressed="${on}">${on ? `<span class="ack">${CHECK}</span>` : ''}${esc(a.name)}</button>`;
  }
  function apChipsHtml(ctx) {
    const sel = apSel(ctx).map(x => x.id).filter(id => areaById(id));
    if (areaKey(apDraft(ctx))) {
      const ids = [...new Set([...sel, ...apMatches(ctx).map(a => a.id)])].slice(0, 12);
      return ids.map(id => apChip(ctx, id)).join('');
    }
    const o = apOrder(ctx); const showAll = AP.all[ctx];
    // At most 6 chips before "More…" (so Save stays on screen): selected chips always show,
    // unselected suggestions fill what's left in their original order; the rest move under More.
    const front = sel.filter(id => !o.top.includes(id) && !(showAll && o.rest.includes(id)));
    let slots = Math.max(AREA_MAX, sel.length) - front.length - o.top.filter(id => sel.includes(id)).length;
    const topShown = o.top.filter(id => { if (sel.includes(id)) return true; if (slots > 0) { slots--; return true; } return false; });
    const restAll = [...o.rest, ...o.top.filter(id => !topShown.includes(id))].filter(id => areaById(id)).sort((x, y) => areaById(x).name.localeCompare(areaById(y).name));
    let html = [...front, ...topShown].map(id => apChip(ctx, id)).join('');
    if (restAll.length) html += showAll ? `<div class="aall">${L('All areas, A to Z')}</div>${restAll.filter(id => !front.includes(id)).map(id => apChip(ctx, id)).join('')}` : `<button type="button" class="achip more" data-apmore="${ctx}">${L('More…')}</button>`;
    return html;
  }
  const apFull = (ctx) => apSel(ctx).length >= AREA_MAX && !apChoiceSelected(ctx);
  function apChoiceSelected(ctx) { const c = apChoice(ctx); return !!(c && apSel(ctx).some(x => x.id === c.id)); }
  function apHint(ctx) {

  function saveExpense(id) {
    const amt = num('e-amount'); if (!(amt > 0)) { showErr('e-err', L('Enter an amount above $0.')); return; }
    const dateV = val('e-date'); if (!dateV) { showErr('e-err', L('Pick a date.')); return; }
    const data = { amount: amt, category: val('e-cat'), date: fromLocalInput(dateV), note: val('e-note'), blockId: val('e-block') };
    const wantRec = document.getElementById('e-rec').checked;
    let x;
    if (id) { x = state.expenses.find(y => y.id === id); Object.assign(x, data); delete x.sample; } else { x = Object.assign({ id: uid() }, data); state.expenses.push(x); }
    const r = seriesOf(x);
    if (wantRec && (!r || !r.active)) {
      const nr = { id: 'r-' + uid(), category: x.category, amount: x.amount, note: x.note, day: new Date(x.date).getDate(), start: monthKey(x.date), active: true };
      state.recurring.push(nr); x.seriesId = nr.id; x.month = monthKey(x.date); delete x.noRecur;
    } else if (wantRec && r) { Object.assign(r, { category: x.category, amount: x.amount, note: x.note }); delete r.sample; }
    else if (!wantRec && r && r.active) { if (r.detected) notRecurring(r.id); else stopRecurring(r.id); }
    syncAll(); save(); closeSheet(); render();
  }

    if (d.series) { const list = state.expenses.filter(x => x.seriesId === d.series).sort((a, b) => Date.parse(b.date) - Date.parse(a.date)); if (list[0]) expSheet(list[0]); return; }

    if (d.station) { stationSheet(stationById(d.station)); return; }
    if (d.place) { placeSheet(state.places.find(p => p.id === d.place)); return; }
    if (d.reveal) { revealed.has(d.reveal) ? revealed.delete(d.reveal) : revealed.add(d.reveal); document.getElementById('pl-list').innerHTML = placeList(); return; }
    if (d.used) { const p = state.places.find(x => x.id === d.used); p.uses = (p.uses || 0) + 1; p.lastUsed = new Date().toISOString(); save(); document.getElementById('pl-list').innerHTML = placeList(); haptic('light'); return; }
    if (d.areaview) { state.ui.areaView = d.areaview; persistLocal(); render(); return; }
    if (d.geopick) { const a = areaById(d.geopick); const c = a && a.geo && a.geo.cands && a.geo.cands[+d.i]; if (c) { a.geo = Object.assign({}, c, { src: 'search', status: 'ok', at: new Date().toISOString() }); state.ui.mapSel = a.id; save(); mvRender(); geoMaybeStart(); } return; }
    if (d.geopin) { if (MV) { MV.pinFor = d.geopin; mvRender(); } return; }
    if (d.apchip) { apToggle(d.apctx, d.apchip); return; }
    if (d.apmore) { AP.all[d.apmore] = true; apRefresh(d.apmore); return; }
    if (d.apadd) { const ok = apCommit(d.apadd); apRefresh(d.apadd); if (ok) { const i = document.getElementById('ap-in-' + d.apadd); if (i) i.focus(); } return; }
    if (d.amedit) { amEdit = d.amedit; areaSheet(); const i = document.getElementById('am-name'); if (i) i.focus(); return; }
    if (d.wodo) { wiz.odo = Number(d.wodo); renderWizard(); return; }
    if (d.sched) { schedSheet(state.scheduled.find(x => x.id === d.sched)); return; }
    if (d.schedstart) { startFromSchedule(d.schedstart); return; }
    if (d.slen) { document.getElementById('s-hrs').value = d.slen; document.querySelectorAll('[data-slen]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.slen === d.slen))); return; }
    if (d.wst) { wiz.stationId = d.wst; wiz.newst = ''; renderWizard(); return; }
    if (d.wlen) { wiz.hrs = Number(d.wlen); document.querySelectorAll('[data-wlen]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.wlen === d.wlen))); const p = document.getElementById('w-preview'); if (p) p.innerHTML = offerPreview(); wizCheck(); return; }
    if (d.wgrab) { const k = d.wgrab; if (k === 'clear' || wiz.grabKind === k) { wiz.grabbed = ''; wiz.grabKind = ''; } else { wiz.grabKind = k; wiz.grabbed = toLocalInput(k === 'surge' ? new Date() : new Date(Date.parse(wizStartIso()) - 72 * 3600e3)); } renderWizard(); return; }

    switch (d.act) {
      case 'fresh': clearSample(); state.ui.welcomed = true; save(); render(); openOnboarding('fresh'); break;
      case 'keep-sample': state.ui.welcomed = true; persistLocal(); render(); break;
      case 'start': startWizard(); break;
      case 'w-back': if (wiz && wiz.step > 1) { wiz.step--; renderWizard(); } break;
      case 'w-next': if (!wiz || !wizValid()) return; if (wiz.step === 1 && (wiz.newst || '').trim()) wizAddStation(); if (wiz.step < 3) { wiz.step++; renderWizard(); } else beginBlock(); break;
      case 'w-addst': { wiz.newst = val('w-newst'); if (!wiz.newst) { document.getElementById('w-newst').focus(); return; } wizAddStation(); renderWizard(); break; }
      case 'next-step': nextStep(); break;
      case 'next-step-force': nextStep(true); break;
      case 'areas-fix': amQuery = ''; amEdit = null; areaSheet(); break;
      case 'am-cancel': amEdit = null; areaSheet(); break;
      case 'am-save': if (areaRename(d.id, val('am-name'))) { amEdit = null; save(); areaSheet(); render(); } break;
      case 'am-merge': if (areaRename(d.id, val('am-name'), true)) { amEdit = null; save(); areaSheet(); render(); } break;
      case 'areas-all': state.ui.more['areas-all'] = !state.ui.more['areas-all']; persistLocal(); render(); break;
      case 'map-open': openMap(); break;
      case 'map-close': closeMap(); break;
      case 'geo-yes': state.ui.geoConsent = true; persistLocal(); mvRender(); geoMaybeStart(); break;
      case 'geo-no': if (MV) { MV.declined = true; mvRender(); } break;
      case 'geo-off': state.ui.geoConsent = false; persistLocal(); render(); break;
      case 'pin-cancel': if (MV) { MV.pinFor = null; mvRender(); } break;
      case 'am-askdel': { const n = (areaStats()[d.id] || {}).n || 0; document.getElementById('am-del').innerHTML = `<div class="confirm danger-zone"><strong>${L('Remove this area?')}</strong><span class="muted" style="font-size:14px">${L('Blocks with this area: {n}. The blocks themselves stay.', { n })}</span><div class="btnrow"><button class="btn glassy" type="button" data-act="am-cancel">${L('Keep it')}</button><button class="btn danger" type="button" data-act="am-del" data-id="${d.id}">${L('Remove')}</button></div></div>`; break; }
      case 'am-del': areaRemove(d.id); amEdit = null; save(); areaSheet(); render(); break;
      case 'fix-odo': { document.getElementById('lv-warn').innerHTML = ''; const o = document.getElementById('lv-odo'); if (o) { o.focus(); o.select(); } break; }
      case 'ask-cancel': document.getElementById('cancel-slot').innerHTML = `<div class="confirm danger-zone"><strong>${L('Cancel this block?')}</strong><span class="muted" style="font-size:14px">${L('Nothing is saved. Start again when you leave home.')}</span><div class="btnrow"><button class="btn glassy" type="button" data-act="keep-cancel">${L('Keep it')}</button><button class="btn danger" type="button" data-act="discard-block">${L('Cancel block')}</button></div></div>`; break;
      case 'keep-cancel': document.getElementById('cancel-slot').innerHTML = ''; break;
      case 'skip-step': { const a = state.active; const s = STEPS[nextStepIndex(a)]; if (s && s.optional) { a.skipped = (a.skipped || []).concat(s.id); save(); render(); } break; }
      case 'undo-step': undoStep(); break;
      case 'save-block': saveActive(); break;
      case 'discard-block': state.active = null; save(); render(); window.scrollTo(0, 0); break;
      case 'ask-discard': document.getElementById('discard-slot').innerHTML = `<div class="confirm danger-zone"><strong>${L('Discard this block?')}</strong><span class="muted" style="font-size:14px">${L("Its time and miles won't be saved.")}</span><div class="btnrow"><button class="btn glassy" type="button" data-act="keep-discard">${L('Keep it')}</button><button class="btn danger" type="button" data-act="discard-block">${L('Discard')}</button></div></div>`; break;
      case 'keep-discard': document.getElementById('discard-slot').innerHTML = `<button class="btn danger small" type="button" data-act="ask-discard">${L('Discard without saving')}</button>`; break;
      case 'show-extra': { const x = document.getElementById('lv-extra'); if (x) x.hidden = false; t.remove(); const f = x && x.querySelector('input'); if (f) f.focus(); break; }
      case 'add-past': blockSheet(null); break;
      case 'save-sheet-block': {
        if (!apCommit('edit', true)) { apRefresh('edit'); return; }
        const pay = num('f-pay');
        if (val('f-pay') === '' || !(pay >= 0)) { showErr('f-err', L('Enter the offer pay for this block.')); return; }
        const leaveV = val('f-leave'); if (!leaveV) { showErr('f-err', L('Pick when you left home.')); return; }
        const st = resolveStation(val('f-station'), 'f-newst');
        const mins = {}; PHASES.forEach(p => { mins[p.id] = Math.max(0, num('f-' + p.id) || 0); });
        const legs = {}; ['to_station', 'route', 'home'].forEach(k => { legs[k] = Math.max(0, num('f-leg-' + k) || 0); }); if (document.getElementById('f-leg-unsplit')) legs.unsplit = Math.max(0, num('f-leg-unsplit') || 0);
        const leave = fromLocalInput(leaveV); const start = new Date(Date.parse(leave) + mins.drive_to * 6e4).toISOString();
        const data = { areas: sheetAreas.slice(), leave, start, stationId: st ? st.id : '', station: st ? st.name : '', scheduledHrs: num('f-sched') || 0, basePay: pay, tips: Math.max(0, num('f-tips') || 0), grabbedAt: fromLocalInput(val('f-grab')), markedSurge: document.getElementById('f-surge').checked, blockStart: fromLocalInput(val('f-bstart')) || start, packages: parseInt(val('f-pk')) || 0, stops: parseInt(val('f-stops')) || 0, legs, mins };
        data.miles = blockMiles(data);
        if (d.id) { const b = state.blocks.find(x => x.id === d.id); Object.assign(b, data); delete b.sample; } else state.blocks.push(Object.assign({ id: uid(), status: 'done' }, data));
        if (d.from) state.scheduled = state.scheduled.filter(x => x.id !== d.from);
        save(); closeSheet(); render(); break;
      }
      case 'ask-del-block': confirmDelete(L('Delete this block?'), L('Expenses linked to it stay, but become unlinked.'), 'del-block', scrim.querySelector('[data-act="save-sheet-block"]').dataset.id); break;
      case 'del-block': { const id = d.id; state.blocks = state.blocks.filter(b => b.id !== id); state.expenses.forEach(x => { if (x.blockId === id) x.blockId = ''; }); save(); closeSheet(); render(); break; }
      case 'add-exp': expSheet(null); break;
      case 'save-exp': saveExpense(d.id); break;
      case 'ask-del-exp': { const id = scrim.querySelector('[data-act="save-exp"]').dataset.id; const x = state.expenses.find(y => y.id === id); confirmDelete(L('Delete this expense?'), x && seriesOf(x) && seriesOf(x).active ? L('Only this month is removed. The monthly payment keeps going.') : '', 'del-exp', id); break; }
      case 'del-exp': { const x = state.expenses.find(y => y.id === d.id); const r = seriesOf(x); if (r && x.month) { r.skip = (r.skip || []).concat(x.month); } state.expenses = state.expenses.filter(y => y.id !== d.id); save(); closeSheet(); render(); break; }
      case 'add-station': stationSheet(null); break;
      case 'save-station': {
        const name = val('st-name'); if (!name) { showErr('st-err', L('Give the station a name.')); return; }
        const data = { name, code: val('st-code'), base: num('st-base') > 0 ? num('st-base') : null, fav: document.getElementById('st-fav').checked };
        if (d.id) { const s = stationById(d.id); Object.assign(s, data); delete s.sample; state.blocks.forEach(b => { if (b.stationId === s.id) b.station = s.name; }); } else state.stations.push(Object.assign({ id: 's-' + uid() }, data));
        save(); closeSheet(); render(); break;
      }
      case 'ask-del-station': confirmDelete(L('Delete this station?'), L('Past blocks keep the station name.'), 'del-station', scrim.querySelector('[data-act="save-station"]').dataset.id); break;
      case 'del-station': state.stations = state.stations.filter(s => s.id !== d.id); save(); closeSheet(); render(); break;
      case 'add-place': placeSheet(null); break;
      case 'add-code': document.getElementById('p-codes').insertAdjacentHTML('beforeend', codeRow({ label: 'Door', value: '' })); break;
      case 'del-code': { const row = t.closest('.codefield'); if (row) row.remove(); break; }
      case 'save-place': {
        const address = val('p-addr'); if (!address) { showErr('p-err', L('Add the address so you can find this place again.')); return; }
        const codes = Array.from(document.querySelectorAll('#p-codes .codefield')).map(r => ({ label: r.querySelector('select').value, value: r.querySelector('input').value.trim() })).filter(c => c.value);
        const data = { address, city: val('p-city'), name: val('p-name'), codes, notes: val('p-notes') };
        if (d.id) { const p = state.places.find(x => x.id === d.id); Object.assign(p, data); delete p.sample; } else state.places.push(Object.assign({ id: uid(), uses: 0, lastUsed: new Date().toISOString() }, data));
        save(); closeSheet(); render(); break;
      }
      case 'ask-del-place': confirmDelete(L('Delete this place?'), L('Its codes are removed from your phone and your backup.'), 'del-place', scrim.querySelector('[data-act="save-place"]').dataset.id); break;
      case 'del-place': state.places = state.places.filter(p => p.id !== d.id); save(); closeSheet(); render(); break;
      case 'clear-sample': clearSample(); state.ui.welcomed = true; save(); render(); break;
      case 'load-sample': { const s = sampleData(); state.stations = state.stations.concat(s.stations.filter(x => !stationById(x.id))); state.areas = state.areas.concat(s.areas.filter(a => !areaById(a.id))); state.blocks = state.blocks.concat(s.blocks); state.expenses = state.expenses.concat(s.expenses); state.places = state.places.concat(s.places); state.recurring = state.recurring.concat(s.recurring.filter(r => !state.recurring.some(x => x.id === r.id))); state.scheduled = state.scheduled.concat(s.scheduled.filter(r => !state.scheduled.some(x => x.id === r.id))); syncAll(); save(); render(); break; }
      case 'ask-reset': document.getElementById('reset-slot').innerHTML = `<div class="confirm" style="margin-top:12px"><strong>${L('Erase all blocks, expenses, places and settings?')}</strong><span class="muted" style="font-size:14px">${L("This can't be undone.")}</span><div class="btnrow"><button class="btn glassy" type="button" data-act="cancel-reset">${L('Cancel')}</button><button class="btn danger" type="button" data-act="reset">${L('Erase everything')}</button></div></div>`; break;
      case 'cancel-reset': document.getElementById('reset-slot').innerHTML = ''; break;
      case 'reset': { const prefs = {}; ['theme', 'palette', 'glass'].forEach(k => { prefs[k] = state.settings[k]; }); state = seed(); Object.assign(state.settings, prefs); state = initState(state); save(); refresh(); openOnboarding('first'); break; }
      case 'backup-now': backupNow(); break;
      case 'add-sched': schedSheet(null); break;
      case 'save-sched': saveSched(d.id); break;
      case 'ask-del-sched': confirmDelete(L('Remove this booked block?'), L('Cancel it in the Flex app too, so the hours free up there.'), 'del-sched', scrim.querySelector('[data-act="save-sched"]').dataset.id); break;
      case 'del-sched': state.scheduled = state.scheduled.filter(x => x.id !== d.id); save(); closeSheet(); render(); break;
      case 'show-guide': openOnboarding('replay'); break;
      case 'close-sheet': closeSheet(); break;
    }
  });
  document.addEventListener('click', (e) => {
    const g = e.target && e.target.closest && e.target.closest('[data-mapsel]'); if (!g) return;
    state.ui.mapSel = state.ui.mapSel === g.dataset.mapsel ? null : g.dataset.mapsel; persistLocal();
    if (MV) mvRender(); else refreshInlineMap(); haptic('light');
  });
  document.addEventListener('toggle', (e) => {
    const g = e.target; if (!g || !g.dataset) return;
    if (g.dataset.guide) { if (g.open !== (g.dataset.init === '1')) { state.ui.guideOpen[g.dataset.guide] = g.open; g.dataset.init = g.open ? '1' : '0'; persistLocal(); } return; }
    if (g.dataset.more) { if (g.dataset.more === 'wiz') { if (wiz) wiz.more = g.open; return; } if (!!state.ui.more[g.dataset.more] !== g.open) { state.ui.more[g.dataset.more] = g.open; persistLocal(); } }
  }, true);
  // Tapping a prefilled number selects it, so typing replaces it.
  document.addEventListener('focusin', (e) => { const t = e.target; if (t && t.tagName === 'INPUT' && t.type === 'number' && t.value) setTimeout(() => { try { t.select(); } catch (x) {} }, 0); });
  document.addEventListener('keydown', (e) => {
    const t = e.target; if (e.key !== 'Enter' || !t || !t.dataset) return;
    if (t.dataset.apin) { e.preventDefault(); const c = t.dataset.apin; apCommit(c); apRefresh(c); }
    if (t.id === 'am-name') { e.preventDefault(); const b = document.querySelector('[data-act="am-save"]'); if (b) b.click(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'f-station') { const row = document.getElementById('f-newst-row'); if (row) row.hidden = t.value !== '__new'; }
    if (t.id === 's-st') { const row = document.getElementById('s-newst-row'); if (row) row.hidden = t.value !== '__new'; }
    if (t.id === 'e-cat') { const r = document.getElementById('e-rec'); if (r && r.dataset.auto) r.checked = !!(CATS[t.value] && CATS[t.value].rec); }
    if (t.id === 'e-rec') delete t.dataset.auto;
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (wiz) {
      if (t.id === 'w-pay') { wiz.pay = t.value; const p = document.getElementById('w-preview'); if (p) p.innerHTML = offerPreview(); }
      if (t.id === 'w-start') { wiz.startTime = t.value; wiz.fixedStart = null; const sd = document.getElementById('w-startday'); if (sd) sd.textContent = wizStartDay(); }
      if (t.id === 'w-grab') { wiz.grabbed = t.value; if (wiz.grabKind) { wiz.grabKind = ''; document.querySelectorAll('[data-wgrab]').forEach(b => b.setAttribute('aria-pressed', 'false')); const n = document.querySelector('.grabnote'); if (n) n.remove(); } }
      if (t.id === 'w-odo') wiz.odo = t.value === '' ? '' : parseFloat(t.value);
      if (t.id === 'w-newst') { wiz.newst = t.value; if (t.value.trim() && wiz.stationId) { wiz.stationId = ''; document.querySelectorAll('[data-wst]').forEach(b => { b.setAttribute('aria-checked', 'false'); const rd = b.querySelector('.rd'); if (rd) rd.innerHTML = ''; }); } }
      wizCheck();
    }
    if (t.id === 'am-q') { amQuery = t.value; const l = document.getElementById('am-list'); if (l) l.innerHTML = areaListHtml(); return; }
    if (t.dataset && t.dataset.apin) { apSetDraft(t.dataset.apin, t.value); apPersist(t.dataset.apin, false); apRefresh(t.dataset.apin); return; }
    if (t.id === 'lv-odo') { const er = document.getElementById('lv-err'); if (er) er.hidden = true; }
    if (t.id === 'sum-tips' && state.active) { state.active.tips = Math.max(0, parseFloat(t.value) || 0); save(); updateSummaryMoney(); return; }
    if (t.id === 'pl-q') { state.ui.plq = t.value; document.getElementById('pl-list').innerHTML = placeList(); return; }
    if (t.dataset.veh) { state.settings.vehicle[t.dataset.veh] = parseFloat(t.value) || 0; V().customized = true; save(); const c = document.getElementById('v-cpm'); if (c) c.innerHTML = cpmTable(cpmParts()); return; }
    if (t.dataset.leg) { state.settings.taxLegs[t.dataset.leg] = t.checked; save(); return; }
    if (t.dataset.pref) { state.settings[t.dataset.pref] = t.checked; savePrefs(); refresh(); return; }
    if (t.dataset.set) { state.settings[t.dataset.set] = parseFloat(t.value) || 0; save(); }
  });
  if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.settings.theme === 'system') refresh(); }); } catch (e) {} }
  if (tg) { try { tg.onEvent('themeChanged', () => refresh()); } catch (e) {} }

  // ---------- start ----------
  if (syncAll()) persistLocal();
  applyAppearance();
  if (!raw && cloudAvailable()) {
    app.innerHTML = `<div class="glass empty" style="margin-top:40px">${L('Checking your Telegram backup…')}</div>`;
    cloudCheck(false, () => { if (app.querySelector('.empty') && !app.querySelector('.topline')) render(); if (!state.ui.onboarded) openOnboarding('first'); });
  } else {
    render();
    if (cloudAvailable()) cloudCheck(true);
    if (!raw) openOnboarding('first');
  }
})();

</script>
