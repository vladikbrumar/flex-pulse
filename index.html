<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flex Pulse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one iPhone-width app shell over a soft ambient backdrop; glass cards; a floating capsule tab bar. Each tab maps to a SwiftUI view later. */
:root {
  --accent-l: #D9480F; --accent-d: #FF7A3D; --accent2-l: #E64980; --accent2-d: #F783AC;
  --accent: var(--accent-l);
  --accent-2: var(--accent2-l);
  --on-accent: #FFFFFF;
  --bg: #EEF0F4;
  --surface: #FFFFFF;
  --surface-2: rgba(120, 128, 145, 0.10);
  --glass: rgba(255, 255, 255, 0.58);
  --glass-strong: rgba(255, 255, 255, 0.80);
  --glass-edge: rgba(255, 255, 255, 0.85);
  --glass-shadow: 0 8px 28px rgba(30, 40, 70, 0.10), 0 1px 2px rgba(30, 40, 70, 0.06);
  --fg: #14161B;
  --muted: #646B76;
  --hair: rgba(20, 30, 50, 0.10);
  --good: #18864A; --warn: #B7791F; --bad: #C4302B;
  --ph-drive: #8C95A5; --ph-load: #DDA015; --ph-return: #BCC3CE;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: var(--accent-d); --accent-2: var(--accent2-d); --on-accent: #120A05;
    --bg: #0B0C10; --surface: #1A1C22; --surface-2: rgba(255, 255, 255, 0.07);
    --glass: rgba(30, 32, 40, 0.52); --glass-strong: rgba(34, 36, 44, 0.82); --glass-edge: rgba(255, 255, 255, 0.14);
    --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.3);
    --fg: #F2F3F5; --muted: #9DA3AE; --hair: rgba(255, 255, 255, 0.10);
    --good: #45CB82; --warn: #F2C14E; --bad: #FF6B66;
    --ph-drive: #6E7889; --ph-load: #F2C14E; --ph-return: #4A5262;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: var(--accent-d); --accent-2: var(--accent2-d); --on-accent: #120A05;
  --bg: #0B0C10; --surface: #1A1C22; --surface-2: rgba(255, 255, 255, 0.07);
  --glass: rgba(30, 32, 40, 0.52); --glass-strong: rgba(34, 36, 44, 0.82); --glass-edge: rgba(255, 255, 255, 0.14);
  --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.3);
  --fg: #F2F3F5; --muted: #9DA3AE; --hair: rgba(255, 255, 255, 0.10);
  --good: #45CB82; --warn: #F2C14E; --bad: #FF6B66;
  --ph-drive: #6E7889; --ph-load: #F2C14E; --ph-return: #4A5262;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(55% 38% at 12% 6%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 72%),
    radial-gradient(45% 32% at 92% 24%, color-mix(in srgb, var(--accent-2) 24%, transparent), transparent 72%),
    radial-gradient(60% 40% at 30% 70%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 75%),
    radial-gradient(50% 35% at 85% 95%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 75%),
    var(--bg); }

.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge); border-radius: var(--r); }
:root[data-glass="off"] .glass { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; border-color: var(--hair); box-shadow: none; }
:root[data-glass="off"] .ambient { background: var(--bg); }
@media (prefers-reduced-transparency: reduce) { .glass { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; } }

.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(112px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 22px; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 28px; padding-top: 6px; }
.topline .date { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.pill { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); white-space: nowrap; }
h1 { font-family: var(--font-round); font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: -14px 0 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 10px 6px; display: flex; justify-content: space-between; gap: 8px; }
h2 span:last-child { text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
section { display: flex; flex-direction: column; min-width: 0; }
.neg { color: var(--bad); }
.foot { color: var(--muted); font-size: 13px; margin: 10px 6px 0; }
.muted { color: var(--muted); }

.btn { border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 650; background: var(--surface-2); color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 1px 0 rgba(255,255,255,0.35); }
.btn.glassy { background: var(--glass-strong); border: 1px solid var(--glass-edge); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.btn.danger { background: transparent; color: var(--bad); }
.btn.block { width: 100%; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.btn.big { padding: 18px; font-size: 17px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 0; }
@media (prefers-reduced-motion: no-preference) { .btn, .seg button, .tabbar button, .card { transition: transform 0.15s ease, background-color 0.2s ease; } .btn:active, .card:active { transform: scale(0.98); } }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; gap: 4px; border-radius: 999px; }
.seg button { border: 0; background: transparent; padding: 8px 6px; border-radius: 999px; font-size: 13px; font-weight: 650; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--fg); box-shadow: 0 2px 8px rgba(0,0,0,0.12), inset 0 1px 0 var(--glass-edge); }

.welcome { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.welcome strong { font-family: var(--font-round); font-size: 19px; }
.welcome p { margin: 0; color: var(--muted); font-size: 14px; }

.hero { padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 16px; }
.hero .k { color: var(--muted); font-size: 13px; font-weight: 650; }
.hero .big { font-family: var(--font-round); font-size: 48px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 4px; }
.split { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.split span { display: block; height: 100%; }
.bridge { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 10px; font-size: 15px; align-items: center; }
.bridge .sw { width: 10px; height: 10px; border-radius: 3px; }
.bridge .v { text-align: right; font-variant-numeric: tabular-nums; }
.bridge .total { border-top: 1px solid var(--hair); padding-top: 8px; font-weight: 750; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { color: var(--muted); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; }
.tile .v { font-family: var(--font-round); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .s { color: var(--muted); font-size: 12px; }
.tile .meter { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.tile .meter span { display: block; height: 100%; border-radius: 4px; }

.bars { padding: 16px 12px 12px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 180px; }
.bars.six { grid-template-columns: repeat(6, 1fr); }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; height: 100%; min-width: 0; }
.bar .fill { width: 66%; max-width: 30px; background: linear-gradient(to top, color-mix(in srgb, var(--accent) 70%, transparent), var(--accent)); border-radius: 8px 8px 4px 4px; min-height: 3px; }
.bar .fill.cost { background: linear-gradient(to top, color-mix(in srgb, var(--accent-2) 65%, transparent), var(--accent-2)); }
.bar .fill.neg { background: var(--bad); }
.bar .fill.zero { background: var(--hair); }
.bar .amt { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar .day { font-size: 12px; color: var(--muted); font-weight: 650; }
.bar.today .day { color: var(--accent); }

/* Live block */
.live { padding: 18px; display: flex; flex-direction: column; gap: 16px; border: 1.5px solid color-mix(in srgb, var(--accent) 60%, transparent) !important; box-shadow: 0 10px 34px color-mix(in srgb, var(--accent) 22%, transparent), inset 0 1px 0 var(--glass-edge) !important; }
.live .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.live .tag { color: var(--accent); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
.live .meta { color: var(--muted); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .dot { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: 0.25; } }
.timers { display: grid; grid-template-columns: 1.25fr 1fr; gap: 10px; }
.timer { background: var(--surface-2); border-radius: 18px; padding: 12px 14px; min-width: 0; }
.timer .k { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.timer .clock { font-family: var(--font-num); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 2px; }
.timer .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.timer.off .clock { color: var(--muted); }
.timer.route { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.livegrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.livegrid > div { background: var(--surface-2); border-radius: 14px; padding: 9px 10px; min-width: 0; }
.livegrid .k { font-size: 10.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.livegrid .v { font-family: var(--font-round); font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; position: relative; padding-bottom: 12px; }
.steps li:last-child { padding-bottom: 0; }
.steps li::before { content: ""; position: absolute; left: 10px; top: 18px; bottom: -2px; width: 2px; background: var(--hair); }
.steps li:last-child::before { display: none; }
.steps li.done::before { background: color-mix(in srgb, var(--accent) 55%, transparent); }
.steps .mk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hair); background: var(--glass-strong); display: grid; place-items: center; position: relative; z-index: 1; }
.steps li.done .mk { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.steps li.done .mk svg { width: 12px; height: 12px; }
.steps li.skip .mk { border-style: dashed; }
.steps li.next .mk { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.steps .lb { font-size: 14px; font-weight: 600; padding-top: 1px; }
.steps li.todo .lb, .steps li.skip .lb { color: var(--muted); font-weight: 500; }
.steps .lb small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.steps .tm { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; white-space: nowrap; }
.action { background: var(--surface-2); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.action .title { font-family: var(--font-round); font-weight: 800; font-size: 17px; }
.inline { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.inline label { font-size: 14px; font-weight: 600; }
.inline label small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.inline input { border: 1px solid var(--hair); background: var(--glass-strong); border-radius: 12px; padding: 10px 12px; width: 140px; text-align: right; font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 650; }
.inline input.sm { width: 92px; font-size: 16px; }
.linkrow { display: flex; justify-content: space-between; gap: 10px; }
.linkbtn { border: 0; background: var(--surface-2); color: var(--fg); font-weight: 650; padding: 7px 14px; border-radius: 999px; font-size: 14px; }
.confirm { background: var(--surface-2); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sumgrid { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.sumgrid .n { text-align: right; font-weight: 650; }
.sumgrid .hd { grid-column: 1 / -1; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 6px; }

/* Block cards */
.daygroup { display: flex; flex-direction: column; gap: 10px; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px; }
.dayhead b { font-family: var(--font-round); font-size: 17px; }
.dayhead span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.card { width: 100%; text-align: left; padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; color: var(--fg); }
.card .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.card .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card .who b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .who span { color: var(--muted); font-size: 13px; }
.card .amt { text-align: right; flex-shrink: 0; }
.card .amt b { font-family: var(--font-round); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.card .amt span { color: var(--muted); font-size: 12px; }
.timeline { display: flex; height: 8px; border-radius: 5px; overflow: hidden; gap: 2px; }
.timeline span { display: block; height: 100%; border-radius: 3px; min-width: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 650; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--fg); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.chip.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.chip.tip { background: color-mix(in srgb, var(--accent-2) 16%, transparent); color: var(--accent-2); }
.chip.surge { background: var(--accent); color: var(--on-accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

/* Expenses */
.elist { overflow: hidden; }
.erow { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: none; border: 0; border-top: 1px solid var(--hair); text-align: left; color: var(--fg); }
.erow:first-child { border-top: 0; }
.erow:active { background: var(--surface-2); }
.icon { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35); }
.icon svg { width: 20px; height: 20px; }
.erow .mid { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.erow .mid b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.erow .mid span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.erow .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.erow .v small { display: block; font-weight: 600; font-size: 11px; color: var(--muted); }
.costcard { padding: 16px; display: grid; grid-template-columns: 148px 1fr; gap: 16px; align-items: center; }
@media (max-width: 380px) { .costcard { grid-template-columns: 1fr; justify-items: center; } }
.donut { width: 148px; height: 148px; }
.donut text { fill: var(--fg); }
.donut .sub { fill: var(--muted); }
.costlegend { display: flex; flex-direction: column; gap: 7px; font-size: 13px; min-width: 0; width: 100%; }
.costlegend div { display: grid; grid-template-columns: 10px 1fr auto; gap: 7px; align-items: center; }
.costlegend i { width: 10px; height: 10px; border-radius: 3px; }
.costlegend span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.costlegend b { font-variant-numeric: tabular-nums; }
.costlegend .est { color: var(--muted); font-weight: 500; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { border: 1px solid var(--hair); background: var(--glass-strong); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 650; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.fchip i { width: 8px; height: 8px; border-radius: 50%; }
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.taxcard { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.taxcard .row2 { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.taxcard .row2 .n { text-align: right; font-weight: 650; }
.taxcard .hd { grid-column: 1 / -1; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 8px; }
.taxcard .tot { border-top: 1px solid var(--hair); padding-top: 6px; font-weight: 800 !important; }

/* Guides and mileage */
.guide { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent) !important; background: color-mix(in srgb, var(--accent) 7%, var(--glass)) !important; }
.guide .gt { display: flex; align-items: center; gap: 8px; font-weight: 750; font-size: 15px; color: var(--accent); }
.guide .gt svg { width: 18px; height: 18px; flex-shrink: 0; }
.guide ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--fg); }
.guide li::marker { color: var(--accent); }
.milehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hero .mid { font-family: var(--font-round); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 4px; }
.unit { font-size: 0.45em; font-weight: 700; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.mrow { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: none; border: 0; border-top: 1px solid var(--hair); text-align: left; color: var(--fg); }
.mrow:first-child { border-top: 0; }
.mrow:active { background: var(--surface-2); }
.mtop { display: flex; align-items: center; gap: 12px; width: 100%; }
.mtop .mid { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mtop .mid b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mtop .mid span { color: var(--muted); font-size: 13px; }
.mtop .v { font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mtop .v small { display: block; font-weight: 600; font-size: 11.5px; color: var(--muted); }

.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10.5px; font-weight: 650; color: var(--muted); padding: 6px 0 5px; border-radius: 999px; min-width: 0; }
.tabbar button svg { width: 23px; height: 23px; }

  const blockMiles = (b) => b.legs ? (Number(b.legs.to_station) || 0) + (Number(b.legs.route) || 0) + (Number(b.legs.home) || 0) + (Number(b.legs.unsplit) || 0) + (Number(b.legs.between) || 0) : Number(b.miles) || 0;
  const linkedExp = (id) => state.expenses.filter(e => e.blockId === id && expenseCounts(e)).reduce((a, e) => a + Number(e.amount || 0), 0);

  const irsFor = (d) => { d = new Date(d); return d.getFullYear() === 2026 && d < new Date(2026, 6, 1) ? 0.725 : Number(S().irsRate) || 0; };

  function leadLabel(h) {

  function inRange(iso, period) {

  }

  function periodStats(days) {
    const blocks = state.blocks.filter(b => inRange(b.start, days));

  function taxDeduction(blocks) {

      <div class="head"><span class="tag"><span class="dot"></span>Block in progress</span><span class="meta">${esc(a.station || 'Block')} · ${a.scheduledHrs}h · ${money(a.basePay, 0)}</span></div>
      <div class="timers">
        <div class="timer"><div class="k">Whole trip</div><div class="clock" id="lv-trip">0:00:00</div><div class="s" id="lv-tripmi">0 mi</div></div>
        <div class="timer route" id="lv-routebox"><div class="k">Route</div><div class="clock" id="lv-route">0:00:00</div><div class="s" id="lv-routemi">Starts at station</div></div>

        <div><div class="k">Tips</div><div class="v"><input id="lv-tips" type="number" inputmode="decimal" min="0" step="1" value="${a.tips || 0}" aria-label="Tips" style="width:100%;border:0;background:transparent;font:inherit;padding:0"></div></div>
      </div>

  }

  function finishSummary() {
    const a = state.active;
    const m = minsFromMs(a.ms, Date.now());
    const legs = legsFromOdo(a.odo, latestOdo(a));
    const miles = legs.to_station + legs.route + legs.home + legs.between;
    const net = Number(a.basePay) + Number(a.tips || 0) - vehicleCost(miles);
    return `<div class="confirm"><strong style="font-family:var(--font-round);font-size:17px">Block summary</strong>
      <div class="sumgrid">
        <span class="hd">Time</span>
        ${kv('Home to station', dur(m.drive_to))}${kv('At station', dur(m.load))}${kv('Route', dur(m.deliver))}${kv('Heading home', dur(m.return))}${kv('Whole trip', dur(sumMins(m)))}
        <span class="hd">Miles</span>
        ${kv('Home to station', mi(legs.to_station))}${kv('Station to last stop', mi(legs.route))}${kv('Last stop to home', mi(legs.home))}${kv('Total', mi(miles))}
        <span class="hd">Money</span>
        ${kv('Pay and tips', money(Number(a.basePay) + Number(a.tips || 0)))}${kv('Vehicle cost', '−' + money(vehicleCost(miles)))}${kv('Net', money(net))}

      <button class="btn danger small" type="button" data-act="discard-block">Discard without saving</button></div>`;
  }

  function tick() {
    const a = state.active; if (!a) return;
    const el = (id) => document.getElementById(id); if (!el('lv-trip')) return;
    const now = a.ms.home_end ? Date.parse(a.ms.home_end) : Date.now();
    el('lv-trip').textContent = clock(now - Date.parse(a.ms.home_start));
    const lat = latestOdo(a);
    const tripMiles = a.odo.start != null && lat != null ? Math.max(0, lat - a.odo.start) : 0;
    el('lv-tripmi').textContent = `${mi(tripMiles)} since home`;
    const rb = el('lv-routebox');
    if (a.ms.depart) {
      const rEnd = a.ms.last_stop ? Date.parse(a.ms.last_stop) : Date.now();
      el('lv-route').textContent = clock(rEnd - Date.parse(a.ms.depart));
      const rMiles = a.odo.depart != null ? Math.max(0, (a.odo.last != null ? a.odo.last : (lat != null ? lat : a.odo.depart)) - a.odo.depart) : 0;
      el('lv-routemi').textContent = `${mi(rMiles)} on route${a.ms.last_stop ? ' · done' : ''}`;
      rb.classList.remove('off');
    } else { el('lv-route').textContent = '0:00:00'; el('lv-routemi').textContent = 'Starts when you leave the station'; rb.classList.add('off'); }
    const doneIds = STEPS.filter(s => a.ms[s.id]).map(s => a.ms[s.id]);
    const lastMs = doneIds.length ? Math.max(...doneIds.map(Date.parse)) : Date.parse(a.ms.home_start);
    el('lv-stage').textContent = clock(now - lastMs).replace(/^0:/, '');
    const m = minsFromMs(a.ms, now);
    const bm = basisMins(m, S().basis);
    const net = Number(a.basePay || 0) + Number(a.tips || 0) - vehicleCost(tripMiles);
    el('lv-net').textContent = money(net, 0);
    el('lv-hr').textContent = bm >= 1 ? money(perHour(net, bm), 0) : '—';
  }
  setInterval(() => { if (state.active && state.ui.tab === 'today') tick(); }, 1000);

  function nextStep() {
    const a = state.active; const ni = nextStepIndex(a); const step = STEPS[ni]; if (!step) return;
    if (step.odo) {
      const v = parseFloat((document.getElementById('lv-odo') || {}).value);
      const prev = lastReading(a);
      if (!(v >= 0)) { showErr('lv-err', 'Enter the odometer reading so the app can split your miles.'); return; }
      if (prev != null && v < prev) { showErr('lv-err', `That's lower than your last reading of ${prev.toLocaleString('en-US')}. Check the number.`); return; }
      a.odo[step.odo] = v; a.odoNow = null;
    }
    if (step.id === 'depart') { a.packages = parseInt(val('lv-pk')) || 0; a.stops = parseInt(val('lv-stops')) || 0; }
    if (step.id === 'last_stop') { const s2 = parseInt(val('lv-stops2')); if (s2 >= 0) a.stops = s2; a.returned = parseInt(val('lv-ret')) || 0; }
    a.ms[step.id] = new Date().toISOString();
    if (step.id === 'home_end') a.confirming = true;
    save(); haptic(step.id === 'depart' || step.id === 'last_stop' ? 'medium' : 'light'); render();
  }
  function undoStep() {
    const a = state.active;
    a.confirming = false;
    const doneSteps = STEPS.filter(s => a.ms[s.id] || (a.skipped || []).includes(s.id));
    const last = doneSteps[doneSteps.length - 1];
    if (!last || last.id === 'home_start') { render(); return; }
    if ((a.skipped || []).includes(last.id) && !a.ms[last.id]) a.skipped = a.skipped.filter(x => x !== last.id);
    else { delete a.ms[last.id]; if (last.odo) delete a.odo[last.odo]; }
    save(); render();
  }
  function saveActive() {
    const a = state.active;
    const m = minsFromMs(a.ms, Date.parse(a.ms.home_end || new Date().toISOString())); PHASES.forEach(p => { m[p.id] = Math.round(m[p.id]); });
    const legs = legsFromOdo(a.odo, latestOdo(a));
    const blk = { id: uid(), start: a.ms.station_arrive || a.ms.home_start, leave: a.ms.home_start, stationId: a.stationId, station: a.station, scheduledHrs: a.scheduledHrs, basePay: a.basePay, tips: Number(a.tips) || 0,

  // ---------- Blocks ----------
  function timelineBar(m) {

  function renderBlocks() {

    const groups = [];
    sorted.forEach(b => { const k = dayKey(b.start); const g = groups[groups.length - 1]; if (g && g.k === k) g.items.push(b); else groups.push({ k, items: [b] }); });
    groups.forEach(g => {

    });
    html += `<section><button class="btn glassy block" type="button" data-act="add-past">Add a past block</button><p class="foot">Surge means the offer's $/hr beats that station's base by 50¢ or more. Set a station's base in Settings, or the app learns it from blocks grabbed 2+ days ahead.</p></section>`;
    app.innerHTML = html;
  }

  function stationOptions(selId) {
    const list = [...state.stations].sort((a, b) => (b.fav - a.fav) || a.name.localeCompare(b.name));
    return `<option value="">Choose a station</option>${list.map(s => `<option value="${s.id}" ${s.id === selId ? 'selected' : ''}>${s.fav ? '★ ' : ''}${esc(s.name)}${s.code ? ' (' + esc(s.code) + ')' : ''}</option>`).join('')}<option value="__new">+ New station…</option>`;

  function blockSheet(b) {

    b = b || { id: null, leave: new Date(Date.now() - 5 * 3600e3).toISOString(), stationId: fav ? fav.id : '', scheduledHrs: 3.5, basePay: '', tips: 0, grabbedAt: null, legs: { to_station: '', route: '', home: '' }, mins: { drive_to: 25, load: 20, deliver: 150, return: 25 }, packages: '', stops: '' };

    openSheet(isNew ? 'Add a past block' : 'Edit block', `
      <section><h2><span>Block</span></h2><div class="glass group">
        <div class="field"><label for="f-leave">Left home</label><input id="f-leave" type="datetime-local" value="${toLocalInput(b.leave || b.start)}"></div>

      </div></section>
      <section><h2><span>Pay</span></h2><div class="glass group">
        <div class="field"><label for="f-pay">Offer pay ($)</label><input id="f-pay" type="number" inputmode="decimal" step="0.01" min="0" value="${b.basePay}"></div>

      </div></section>
      <section><h2><span>Miles by leg</span></h2><div class="glass group">
        ${LEGS.map(l => `<div class="field"><label for="f-leg-${l.id}">${l.name}</label><input id="f-leg-${l.id}" type="number" inputmode="decimal" step="0.1" min="0" value="${legs[l.id] != null ? legs[l.id] : ''}"></div>`).join('')}
        ${legs.unsplit ? `<div class="field"><label for="f-leg-unsplit">Not split<small>From before the app tracked legs</small></label><input id="f-leg-unsplit" type="number" inputmode="decimal" step="0.1" min="0" value="${legs.unsplit}"></div>` : ''}
      </div></section>
      <section><h2><span>Time in minutes</span></h2><div class="glass group">
        ${PHASES.map(p => `<div class="field"><label for="f-${p.id}"><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${p.color};margin-right:6px"></span>${p.name}</label><input id="f-${p.id}" type="number" inputmode="numeric" step="1" min="0" value="${Math.round(b.mins[p.id] || 0)}"></div>`).join('')}
      </div><p class="err" id="f-err" hidden></p></section>
      ${msList ? `<section><h2><span>Check-in log</span></h2><div class="glass group">${msList}</div></section>` : ''}
      <button class="btn primary block" type="button" data-act="save-sheet-block" data-id="${b.id || ''}">${isNew ? 'Add block' : 'Save changes'}</button>
      ${isNew ? '' : `<div id="del-slot"><button class="btn danger block" type="button" data-act="ask-del-block">Delete block</button></div>`}
    `);
  }
  function resolveStation(selId, newId) {
    if (selId === '__new') { const name = val(newId); if (!name) return null; const s = { id: 's-' + uid(), name, code: '', base: null, fav: !state.stations.length }; state.stations.push(s); return s; }
    return stationById(selId) || null;
  }

  // ---------- Mileage view ----------
  const LEG_COLORS = { to_station: 'var(--ph-drive)', route: 'var(--accent)', home: 'var(--ph-return)', other: 'var(--muted)' };
  const LEG_NAMES = { to_station: 'Home to station', route: 'Station to last stop', home: 'Last stop to home', other: 'Not split' };
  function legTotals(blocks) {
    const t = { to_station: 0, route: 0, home: 0, other: 0 };
    blocks.forEach(b => { const l = b.legs || { unsplit: Number(b.miles) || 0 }; t.to_station += Number(l.to_station) || 0; t.route += Number(l.route) || 0; t.home += Number(l.home) || 0; t.other += (Number(l.unsplit) || 0) + (Number(l.between) || 0); });
    t.total = t.to_station + t.route + t.home + t.other;
    return t;
  }
  function legBar(t, h) {
    const tot = Math.max(0.0001, t.total);
    return `<div class="split" style="height:${h || 10}px" role="img" aria-label="${['to_station', 'route', 'home', 'other'].filter(k => t[k] > 0).map(k => LEG_NAMES[k] + ' ' + mi(t[k])).join(', ')}">${['to_station', 'route', 'home', 'other'].map(k => t[k] > 0 ? `<span style="width:${t[k] / tot * 100}%;background:${LEG_COLORS[k]}"></span>` : '').join('')}</div>`;
  }
  function renderMileage(per) {
    const blocks = state.blocks.filter(b => inRange(b.start, per));
    const t = legTotals(blocks);
    const stops = blocks.reduce((a, b) => a + (Number(b.stops) || 0), 0);
    const ded = taxDeduction(blocks);
    const pct = (v) => t.total ? Math.round(v / t.total * 100) + '%' : '0%';
    let html = `<section><div class="glass hero">
      <div class="milehead"><div><div class="k">Home to home</div><div class="big">${Math.round(t.total).toLocaleString('en-US')}<span class="unit">mi</span></div></div>
      <div style="text-align:right"><div class="k">Route only</div><div class="mid">${Math.round(t.route).toLocaleString('en-US')}<span class="unit">mi</span></div><div class="k" style="font-weight:500">station to last stop</div></div></div>
      ${legBar(t, 12)}
      <div class="bridge">${['to_station', 'route', 'home', 'other'].filter(k => k !== 'other' || t.other > 0).map(k => `<i class="sw" style="background:${LEG_COLORS[k]}"></i><span>${LEG_NAMES[k]} <span class="muted">${pct(t[k])}</span></span><span class="v">${mi(t[k])}</span>`).join('')}</div>
    </div></section>`;
    html += `<section><div class="tiles">
      <div class="glass tile"><span class="k">Miles per stop</span><span class="v">${stops ? (t.route / stops).toFixed(2) : '—'}</span><span class="s">${stops.toLocaleString('en-US')} stops on route</span></div>
      <div class="glass tile"><span class="k">Route per block</span><span class="v">${blocks.length ? Math.round(t.route / blocks.length) : 0} mi</span><span class="s">${blocks.length} blocks</span></div>
      <div class="glass tile"><span class="k">Mileage deduction</span><span class="v">${money(ded.total, 0)}</span><span class="s">Legs you chose in Taxes</span></div>
      <div class="glass tile"><span class="k">Unpaid driving</span><span class="v">${pct(t.to_station + t.home)}</span><span class="s">To station and home</span></div>
    </div></section>`;
    html += `<section><h2><span>Miles per month</span><span>last 6 months</span></h2>${mileMonthBars()}<div class="legend" style="margin-top:10px">${['to_station', 'route', 'home'].map(k => `<span><i style="background:${LEG_COLORS[k]}"></i>${LEG_NAMES[k]}</span>`).join('')}</div></section>`;
    const sorted = [...blocks].sort((a, b) => Date.parse(b.start) - Date.parse(a.start));
    if (!sorted.length) { html += `<section><div class="glass empty">No blocks in this period yet. Miles appear here after your first block.</div></section>`; return html; }
    const groups = [];
    sorted.forEach(b => { const k = dayKey(b.start); const g = groups[groups.length - 1]; if (g && g.k === k) g.items.push(b); else groups.push({ k, items: [b] }); });
    html += `<section><h2><span>Miles by block</span></h2></section>`;
    groups.forEach(g => {
      const dt = legTotals(g.items);
      html += `<section class="daygroup" style="margin-top:-12px"><div class="dayhead"><b>${esc(dayLabel(g.items[0].start))}</b><span>${mi(dt.total)} · ${mi(dt.route)} route</span></div><div class="glass elist">${g.items.map(b => {
        const bt = legTotals([b]);
        return `<button class="mrow" type="button" data-block="${b.id}"><div class="mtop"><span class="mid"><b>${esc(b.station || 'Block')}</b><span>${timeLabel(b.leave || b.start)}${b.stops ? ' · ' + b.stops + ' stops · ' + (bt.route / b.stops).toFixed(2) + ' mi/stop' : ''}</span></span><span class="v">${mi(bt.total)}<small>${mi(bt.route)} route</small></span></div>${legBar(bt, 7)}</button>`;
      }).join('')}</div></section>`;
    });
    return html;
  }
  function mileMonthBars() {
    const months = []; const n = new Date();
    for (let i = 5; i >= 0; i--) months.push(new Date(n.getFullYear(), n.getMonth() - i, 1));
    const vals = months.map(m => { const end = new Date(m.getFullYear(), m.getMonth() + 1, 1); return legTotals(state.blocks.filter(b => { const x = Date.parse(b.start); return x >= +m && x < +end; })); });
    const max = Math.max(1, ...vals.map(v => v.total));
    return `<div class="glass bars six" role="img" aria-label="Miles driven each month for the last 6 months, split by leg">${months.map((m, i) => { const v = vals[i]; const h = v.total / max * 78;
      return `<div class="bar ${i === 5 ? 'today' : ''}"><span class="amt">${v.total ? Math.round(v.total) + ' mi' : ''}</span>${v.total ? `<span class="stackbar" style="height:${Math.max(h, 3)}%">${['home', 'route', 'to_station', 'other'].map(k => v[k] > 0 ? `<span style="flex:${v[k]};background:${LEG_COLORS[k]}"></span>` : '').join('')}</span>` : '<span class="fill zero" style="height:2%"></span>'}<span class="day">${m.toLocaleDateString('en-US', { month: 'short' })}</span></div>`; }).join('')}</div>`;
  }

  // ---------- Money ----------
  function donut(slices, total, label) {
    const R = 54, C = 2 * Math.PI * R; let off = 0;
    const segs = slices.filter(s => s.v > 0).map(s => { const len = total ? s.v / total * C : 0; const g = `<circle r="${R}" cx="74" cy="74" fill="none" stroke="${s.c}" stroke-width="20" stroke-dasharray="${Math.max(0, len - 1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 74 74)"/>`; off += len; return g; }).join('');
    return `<svg class="donut" viewBox="0 0 148 148" role="img" aria-label="${esc(label)}"><circle r="${R}" cx="74" cy="74" fill="none" stroke="var(--hair)" stroke-width="20"/>${segs}<text x="74" y="72" text-anchor="middle" font-size="19" font-weight="800">${money(total, 0)}</text><text class="sub" x="74" y="91" text-anchor="middle" font-size="11">total cost</text></svg>`;
  }
  function costBreakdown(period) {
    const blocks = state.blocks.filter(b => inRange(b.start, period));
    const miles = blocks.reduce((a, b) => a + blockMiles(b), 0);
    const p = cpmParts(); const est = S().costMode === 'estimate';
    const slices = [];

  function monthBars() {
    const months = []; const n = new Date();
    for (let i = 5; i >= 0; i--) months.push(new Date(n.getFullYear(), n.getMonth() - i, 1));
    const vals = months.map(m => {
      const end = new Date(m.getFullYear(), m.getMonth() + 1, 1);
      const inM = (iso) => { const t = Date.parse(iso); return t >= +m && t < +end; };
      const miles = state.blocks.filter(b => inM(b.start)).reduce((a, b) => a + blockMiles(b), 0);
      const ex = state.expenses.filter(e => inM(e.date) && expenseCounts(e)).reduce((a, e) => a + Number(e.amount || 0), 0);
      return miles * cpmUsed() + ex;
    });
    const max = Math.max(1, ...vals);
    return `<div class="glass bars six" role="img" aria-label="Total driving cost for each of the last 6 months">${months.map((m, i) => { const v = vals[i]; return `<div class="bar ${i === 5 ? 'today' : ''}"><span class="amt">${v ? money(v, 0) : ''}</span><span class="fill cost ${v ? '' : 'zero'}" style="height:${v ? Math.max(v / max * 78, 3) : 2}%"></span><span class="day">${m.toLocaleDateString('en-US', { month: 'short' })}</span></div>`; }).join('')}</div>`;
  }

    return `${guide('How the tax estimate works', ['Each block\'s miles are multiplied by the IRS standard mileage rate for that date. That rate already includes gas, wear and depreciation.', 'Parking, tolls, phone and equipment can usually be deducted on top. Gas and repairs cannot when you use the standard rate.', 'Every leg is tracked separately, so you or your tax pro can decide which legs count.', 'This is an estimate to plan with, not tax advice.'])}
    <section><h2><span>Mileage rate</span></h2><div class="glass group">
        <div class="field"><label for="s-irs">IRS business rate<small>$0.76 per mile from July 1, 2026. Blocks from January to June use $0.725 automatically.</small></label><input id="s-irs" data-set="irsRate" type="number" inputmode="decimal" step="0.005" min="0" value="${s.irsRate}"></div>
      </div></section>
    <section><h2><span>Which legs to deduct</span></h2><div class="glass group">
        ${LEGS.map(l => `<div class="field"><label for="s-leg-${l.id}">${l.name}<small>${l.id === 'route' ? 'Delivery driving. Almost always deductible.' : l.id === 'to_station' ? 'Can count as commuting. Ask your tax pro.' : 'Can count as commuting. Ask your tax pro.'}</small></label><input id="s-leg-${l.id}" data-leg="${l.id}" type="checkbox" ${s.taxLegs[l.id] ? 'checked' : ''}></div>`).join('')}
      </div></section>
    <section><h2><span>Money to set aside</span></h2><div class="glass group">
        <div class="field"><label for="s-tax">Set aside<small>Percent of pay after deductions. Many gig drivers save 20–30%.</small></label><input id="s-tax" data-set="taxPct" type="number" inputmode="numeric" step="1" min="0" max="60" value="${s.taxPct}"></div>
      </div><p class="foot">Shown on Today as "Set aside for tax". At tax time, open Money and use the Tax year card.</p></section>`;
  }

  function settingsStations() {
    const s = S();
    return `${guide('Goals, work time and surge', ['Your <b>net per hour goal</b> colours every $/hr: green at or above it, amber within 20%, red below.', '<b>Work time</b> decides which hours count when the app works out $/hr.', 'Each station has a <b>base pay</b> per hour. Offers paying at least 50¢/hr more are marked Surge.', 'Don\'t know the base yet? Leave it empty. The app learns it from blocks you grabbed 2+ days ahead, which usually pay base.'])}
    <section><h2><span>Your goal</span></h2><div class="glass group">
        <div class="field"><label for="s-goal">Net per hour goal<small>Dollars you want to keep per hour, after car costs</small></label><input id="s-goal" data-set="goal" type="number" inputmode="decimal" step="1" min="0" value="${s.goal}"></div>
      </div></section>
    <section><h2><span>What counts as work time</span></h2><div class="seg glass" role="group" aria-label="Hourly basis">${Object.entries(BASIS).map(([k, b]) => `<button type="button" data-basis="${k}" aria-pressed="${s.basis === k}">${b.name}</button>`).join('')}</div><p class="foot">${BASIS[s.basis].long}. ${s.basis === 'total' ? 'The most honest number, since driving to the station is unpaid time.' : s.basis === 'block' ? 'Closest to the hours Amazon pays you for.' : 'Shows how fast you deliver once you\'re loaded.'}</p></section>
    <section><h2><span>Stations</span></h2><div class="glass group">${state.stations.length ? state.stations.map(st => { const b = stationBase(st.id); const n = state.blocks.filter(x => x.stationId === st.id).length; return `<button class="row" type="button" data-station="${st.id}"><span class="stack"><span>${st.fav ? '<span class="star">★</span> ' : ''}${esc(st.name)}${st.code ? ' <span class="muted">' + esc(st.code) + '</span>' : ''}</span><span class="sub">${b ? 'Base ' + money(b.rate) + '/hr' + (b.from === 'history' ? ', learned' : '') : 'Base not known yet'} · ${n} block${n === 1 ? '' : 's'}</span></span><span class="muted">›</span></button>`; }).join('') : '<div class="row"><span class="muted">No stations yet. Add the one you usually work from.</span></div>'}</div>
      <button class="btn glassy small" type="button" data-act="add-station" style="margin-top:10px;align-self:flex-start">Add station</button></section>`;
  }

  function cpmTable(p) {
    const r = (n, v) => `<div class="row"><span>${n}</span><span class="val">${money(v, 3)}/mi</span></div>`;
    return `${r('Fuel', p.fuel)}${r('Wear and maintenance', p.wear)}${V().ownership !== 'lease' ? r('Depreciation', p.dep) : ''}${r('Insurance, ' + (V().ownership === 'lease' ? 'lease' : V().ownership === 'loan' ? 'interest' : 'fees') + ' share', p.fixed)}<div class="row"><span style="font-weight:750">True cost per mile</span><span class="val" style="font-size:17px">${money(p.total, 3)}/mi</span></div>`;
  }

  function stationSheet(st) {
    const isNew = !st;
    st = st || { id: null, name: '', code: '', base: '', fav: false };
    const learned = st.id ? (() => { const s = stationById(st.id); const keep = s.base; s.base = null; const b = stationBase(st.id); s.base = keep; return b; })() : null;
    openSheet(isNew ? 'Add station' : 'Edit station', `
      <section><div class="glass group">
        <div class="field"><label for="st-name">Name</label><input id="st-name" type="text" value="${esc(st.name)}" placeholder="North station"></div>
        <div class="field"><label for="st-code">Station code<small>Optional, like the code in the Flex app</small></label><input id="st-code" type="text" value="${esc(st.code)}" placeholder="DNO1"></div>
        <div class="field"><label for="st-base">Base pay ($/hr)<small>${learned ? 'Learned so far: ' + money(learned.rate) + '/hr' : 'Leave empty and the app learns it'}</small></label><input id="st-base" type="number" inputmode="decimal" step="0.5" min="0" value="${st.base || ''}"></div>
        <div class="field"><label for="st-fav">Favorite<small>Shown first when you start a block</small></label><input id="st-fav" type="checkbox" ${st.fav ? 'checked' : ''}></div>
      </div><p class="err" id="st-err" hidden></p></section>
      <button class="btn primary block" type="button" data-act="save-station" data-id="${st.id || ''}">${isNew ? 'Add station' : 'Save changes'}</button>
      ${isNew ? '' : `<div id="del-slot"><button class="btn danger block" type="button" data-act="ask-del-station">Delete station</button></div>`}`);
  }

  // ---------- sheet ----------
  function openSheet(title, body) {
    scrim.innerHTML = `<div class="sheet glass" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grabber"></div><div class="sheethead"><h3>${esc(title)}</h3><button class="linkbtn" type="button" data-act="close-sheet">Cancel</button></div>${body}</div>`;
    scrim.hidden = false;
    if (tg && tgAtLeast('6.1')) { try { tg.BackButton.show(); } catch (e) {} }
  }
  function closeSheet() { scrim.hidden = true; scrim.innerHTML = ''; if (tg && tgAtLeast('6.1')) { try { tg.BackButton.hide(); } catch (e) {} } }
  if (tg && tgAtLeast('6.1')) { try { tg.BackButton.onClick(() => closeSheet()); } catch (e) {} }
  scrim.addEventListener('click', (e) => { if (e.target === scrim) closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !scrim.hidden) closeSheet(); });

  function startSheet() {
    const fav = [...state.stations].sort((a, b) => (b.fav - a.fav))[0];
    const soon = new Date(Date.now() + 45 * 6e4); soon.setMinutes(soon.getMinutes() < 30 ? 30 : 60, 0, 0);
    openSheet('Start a block', `
      <section><h2><span>Station</span></h2><div class="glass group">
        <div class="field"><label for="n-station">Station</label><select id="n-station">${stationOptions(fav ? fav.id : '')}</select></div>
        <div class="field" id="n-newst-row" hidden><label for="n-newst">New station name</label><input id="n-newst" type="text" placeholder="e.g. North station"></div>
      </div></section>
      <section><h2><span>The offer</span></h2><div class="glass group">
        <div class="field"><label for="n-pay">Offer pay ($)</label><input id="n-pay" type="number" inputmode="decimal" step="0.01" min="0" placeholder="84.00"></div>
        <div class="field"><label for="n-sched">Block length<small>Hours on the offer</small></label><input id="n-sched" type="number" inputmode="decimal" step="0.5" min="0" value="3.5"></div>
        <div class="field"><label for="n-bstart">Block starts</label><input id="n-bstart" type="datetime-local" value="${toLocalInput(soon)}"></div>
        <div class="field"><label for="n-grab">Grabbed at<small>When you accepted it. Used to spot surge and release timing.</small></label><input id="n-grab" type="datetime-local" value=""></div>
      </div></section>
      <section><h2><span>Leaving home</span></h2><div class="glass group">
        <div class="field"><label for="n-odo">Odometer now<small>The number on your dashboard</small></label><input id="n-odo" type="number" inputmode="decimal" step="0.1" min="0" value="${lastEndOdo() != null ? lastEndOdo() : ''}" placeholder="48210"></div>
      </div><p class="err" id="n-err" hidden></p></section>
      <button class="btn primary block big" type="button" data-act="begin">Start block, leaving home</button>`);
  }
  const lastEndOdo = () => { const b = [...state.blocks].filter(x => x.odo && x.odo.end != null).sort((a, c) => Date.parse(c.start) - Date.parse(a.start))[0]; return b ? b.odo.end : null; };

  const num = (id) => { const el = document.getElementById(id); return el ? parseFloat(el.value) : NaN; };
  const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const showErr = (id, msg) => { const el = document.getElementById(id); if (el) { el.textContent = msg; el.hidden = false; } };

  // ---------- actions ----------
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return;
    const d = t.dataset;
    if (d.range !== undefined) { state.ui.range = Number(d.range); save(); render(); return; }
    if (d.mview) { state.ui.mView = d.mview; save(); render(); window.scrollTo(0, 0); return; }
    if (d.stab) { state.ui.sTab = d.stab; save(); render(); window.scrollTo(0, 0); return; }
    if (d.mperiod) { state.ui.mPeriod = d.mperiod; save(); render(); return; }
    if (d.mcat !== undefined) { state.ui.mCat = d.mcat; save(); render(); return; }
    if (d.basis) { state.settings.basis = d.basis; save(); render(); return; }
    if (d.costmode) { state.settings.costMode = d.costmode; save(); render(); return; }
    if (d.own) { state.settings.vehicle.ownership = d.own; save(); render(); return; }
    if (d.themeSet) { state.settings.theme = d.themeSet; save(); applyAppearance(); render(); return; }
    if (d.palette) { state.settings.palette = d.palette; save(); applyAppearance(); render(); haptic('light'); return; }
    if (d.block) { blockSheet(state.blocks.find(b => b.id === d.block)); return; }
    if (d.exp) { expSheet(state.expenses.find(x => x.id === d.exp)); return; }
    if (d.station) { stationSheet(stationById(d.station)); return; }
    if (d.place) { placeSheet(state.places.find(p => p.id === d.place)); return; }
    if (d.reveal) { revealed.has(d.reveal) ? revealed.delete(d.reveal) : revealed.add(d.reveal); document.getElementById('pl-list').innerHTML = placeList(); return; }
    if (d.used) { const p = state.places.find(x => x.id === d.used); p.uses = (p.uses || 0) + 1; p.lastUsed = new Date().toISOString(); save(); document.getElementById('pl-list').innerHTML = placeList(); haptic('light'); return; }

    switch (d.act) {
      case 'fresh': clearSample(); state.ui.welcomed = true; save(); render(); break;
      case 'keep-sample': state.ui.welcomed = true; save(); render(); break;
      case 'start': startSheet(); break;
      case 'begin': {
        const st = resolveStation(val('n-station'), 'n-newst');
        const pay = num('n-pay'); const odo = num('n-odo');
        if (!st) { showErr('n-err', 'Choose a station, or add a new one.'); return; }
        if (!(pay > 0)) { showErr('n-err', 'Enter the offer pay so the app can work out your hourly rate.'); return; }
        if (!(odo >= 0)) { showErr('n-err', 'Enter your odometer so the app can track miles from home.'); return; }
        const now = new Date().toISOString();
        state.active = { stationId: st.id, station: st.name, basePay: pay, scheduledHrs: num('n-sched') || 0, blockStart: fromLocalInput(val('n-bstart')), grabbedAt: fromLocalInput(val('n-grab')), tips: 0, packages: 0, stops: 0, ms: { home_start: now }, odo: { start: odo }, odoNow: null, skipped: [] };
        state.ui.welcomed = true; state.ui.tab = 'today';
        save(); closeSheet(); haptic('medium'); render(); break;
      }
      case 'next-step': nextStep(); break;
      case 'skip-step': { const a = state.active; const s = STEPS[nextStepIndex(a)]; if (s && s.optional) { a.skipped = (a.skipped || []).concat(s.id); save(); render(); } break; }
      case 'undo-step': undoStep(); break;
      case 'save-block': saveActive(); break;
      case 'discard-block': state.active = null; save(); render(); break;
      case 'add-past': blockSheet(null); break;
      case 'save-sheet-block': {
        const pay = num('f-pay');
        if (val('f-pay') === '' || !(pay >= 0)) { showErr('f-err', 'Enter the offer pay for this block.'); return; }
        const leaveV = val('f-leave'); if (!leaveV) { showErr('f-err', 'Pick when you left home.'); return; }
        const st = resolveStation(val('f-station'), 'f-newst');
        const mins = {}; PHASES.forEach(p => { mins[p.id] = Math.max(0, num('f-' + p.id) || 0); });
        const legs = {}; LEGS.forEach(l => { legs[l.id] = Math.max(0, num('f-leg-' + l.id) || 0); }); if (document.getElementById('f-leg-unsplit')) legs.unsplit = Math.max(0, num('f-leg-unsplit') || 0);
        const leave = fromLocalInput(leaveV);
        const data = { leave, start: new Date(Date.parse(leave) + mins.drive_to * 6e4).toISOString(), stationId: st ? st.id : '', station: st ? st.name : '', scheduledHrs: num('f-sched') || 0, basePay: pay, tips: Math.max(0, num('f-tips') || 0), grabbedAt: fromLocalInput(val('f-grab')), packages: parseInt(val('f-pk')) || 0, stops: parseInt(val('f-stops')) || 0, legs, mins };
        data.miles = blockMiles(data);
        if (d.id) { const b = state.blocks.find(x => x.id === d.id); Object.assign(b, data); delete b.sample; if (!b.blockStart || b.ms == null) b.blockStart = data.start; }
        else state.blocks.push(Object.assign({ id: uid(), status: 'done', blockStart: data.start }, data));
        save(); closeSheet(); render(); break;
      }
      case 'ask-del-block': confirmDelete('Delete this block?', 'Expenses linked to it stay, but become unlinked.', 'del-block', scrim.querySelector('[data-act="save-sheet-block"]').dataset.id); break;
      case 'del-block': { const id = d.id; state.blocks = state.blocks.filter(b => b.id !== id); state.expenses.forEach(x => { if (x.blockId === id) x.blockId = ''; }); save(); closeSheet(); render(); break; }
      case 'add-exp': expSheet(null); break;
      case 'save-exp': {
        const amt = num('e-amount'); if (!(amt > 0)) { showErr('e-err', 'Enter an amount above $0.'); return; }
        const dateV = val('e-date'); if (!dateV) { showErr('e-err', 'Pick a date.'); return; }
        const data = { amount: amt, category: val('e-cat'), date: fromLocalInput(dateV), note: val('e-note'), blockId: val('e-block') };
        if (d.id) { const x = state.expenses.find(y => y.id === d.id); Object.assign(x, data); delete x.sample; } else state.expenses.push(Object.assign({ id: uid() }, data));
        save(); closeSheet(); render(); break;
      }
      case 'ask-del-exp': confirmDelete('Delete this expense?', '', 'del-exp', scrim.querySelector('[data-act="save-exp"]').dataset.id); break;
      case 'del-exp': state.expenses = state.expenses.filter(x => x.id !== d.id); save(); closeSheet(); render(); break;
      case 'add-station': stationSheet(null); break;
      case 'save-station': {
        const name = val('st-name'); if (!name) { showErr('st-err', 'Give the station a name.'); return; }
        const data = { name, code: val('st-code'), base: num('st-base') > 0 ? num('st-base') : null, fav: document.getElementById('st-fav').checked };
        if (d.id) { const s = stationById(d.id); Object.assign(s, data); delete s.sample; state.blocks.forEach(b => { if (b.stationId === s.id) b.station = s.name; }); }
        else state.stations.push(Object.assign({ id: 's-' + uid() }, data));
        save(); closeSheet(); render(); break;
      }
      case 'ask-del-station': confirmDelete('Delete this station?', 'Past blocks keep the station name.', 'del-station', scrim.querySelector('[data-act="save-station"]').dataset.id); break;
      case 'del-station': state.stations = state.stations.filter(s => s.id !== d.id); save(); closeSheet(); render(); break;
      case 'add-place': placeSheet(null); break;
      case 'add-code': { const box = document.getElementById('p-codes'); const i = box.children.length; box.insertAdjacentHTML('beforeend', scrim._codeRow({ label: 'Door', value: '' }, i)); break; }
      case 'del-code': { const row = t.closest('.codefield'); if (row) row.remove(); break; }
      case 'save-place': {
        const address = val('p-addr'); if (!address) { showErr('p-err', 'Add the address so you can find this place again.'); return; }
        const codes = Array.from(document.querySelectorAll('#p-codes .codefield')).map(r => ({ label: r.querySelector('select').value, value: r.querySelector('input').value.trim() })).filter(c => c.value);
        const data = { address, city: val('p-city'), name: val('p-name'), codes, notes: val('p-notes') };
        if (d.id) { const p = state.places.find(x => x.id === d.id); Object.assign(p, data); delete p.sample; } else state.places.push(Object.assign({ id: uid(), uses: 0, lastUsed: new Date().toISOString() }, data));
        save(); closeSheet(); render(); break;
      }
      case 'ask-del-place': confirmDelete('Delete this place?', 'Its codes are removed from this device.', 'del-place', scrim.querySelector('[data-act="save-place"]').dataset.id); break;
      case 'del-place': state.places = state.places.filter(p => p.id !== d.id); save(); closeSheet(); render(); break;
      case 'clear-sample': clearSample(); state.ui.welcomed = true; save(); render(); break;
      case 'load-sample': { const s = sampleData(); state.stations = state.stations.concat(s.stations.filter(x => !stationById(x.id))); state.blocks = state.blocks.concat(s.blocks); state.expenses = state.expenses.concat(s.expenses); state.places = state.places.concat(s.places); save(); render(); break; }
      case 'ask-reset': document.getElementById('reset-slot').innerHTML = `<div class="confirm" style="margin-top:12px"><strong>Erase all blocks, expenses, places and settings?</strong><span class="muted" style="font-size:14px">This can't be undone.</span><div class="btnrow"><button class="btn glassy" type="button" data-act="cancel-reset">Cancel</button><button class="btn danger" type="button" data-act="reset">Erase everything</button></div></div>`; break;
      case 'cancel-reset': document.getElementById('reset-slot').innerHTML = ''; break;
      case 'reset': state = { version: 3, stations: [], blocks: [], expenses: [], places: [], active: null, settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), ui: { tab: 'settings', range: 7, welcomed: true, mPeriod: 'month', mCat: '' } }; save(); applyAppearance(); render(); break;
      case 'close-sheet': closeSheet(); break;
      case 'backup-now': backupNow(); break;
    }
  });
  function clearSample() {
    state.blocks = state.blocks.filter(b => !b.sample); state.expenses = state.expenses.filter(x => !x.sample);
    state.places = state.places.filter(p => !p.sample); state.stations = state.stations.filter(s => !s.sample || state.blocks.some(b => b.stationId === s.id));
  }
  function confirmDelete(title, sub, act, id) {
    document.getElementById('del-slot').innerHTML = `<div class="confirm"><strong>${title}</strong>${sub ? `<span class="muted" style="font-size:14px">${sub}</span>` : ''}<div class="btnrow"><button class="btn glassy" type="button" data-act="close-sheet">Keep it</button><button class="btn danger" type="button" data-act="${act}" data-id="${id}">Delete</button></div></div>`;
  }

  document.addEventListener('change', (e) => {
    const t = e.target;
    if ((t.id === 'n-station' || t.id === 'f-station')) { const row = document.getElementById(t.id === 'n-station' ? 'n-newst-row' : 'f-newst-row'); if (row) row.hidden = t.value !== '__new'; }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'lv-odo' && state.active) { const v = parseFloat(t.value); state.active.odoNow = v >= 0 ? v : null; save(); tick(); return; }
    if (t.id === 'lv-tips' && state.active) { state.active.tips = Math.max(0, parseFloat(t.value) || 0); save(); tick(); return; }
    if (t.id === 'pl-q') { state.ui.plq = t.value; document.getElementById('pl-list').innerHTML = placeList(); return; }
    if (t.dataset.veh) { state.settings.vehicle[t.dataset.veh] = parseFloat(t.value) || 0; save(); const c = document.getElementById('v-cpm'); if (c) c.innerHTML = cpmTable(cpmParts()); return; }
    if (t.dataset.leg) { state.settings.taxLegs[t.dataset.leg] = t.checked; save(); return; }
    if (t.dataset.set) {
      const k = t.dataset.set;
      state.settings[k] = t.type === 'checkbox' ? t.checked : (parseFloat(t.value) || 0);
      save();
      if (k === 'glass') { applyAppearance(); render(); }
    }
  });

  if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.settings.theme === 'system') render(); }); } catch (e) {} }
  if (tg) { try { tg.onEvent('themeChanged', () => { applyAppearance(); render(); }); } catch (e) {} }
  if (!savedRaw && cloudAvailable()) {
    app.innerHTML = '<div class="glass empty" style="margin-top:40px">Checking your Telegram backup…</div>';
    restoreFromCloud((data, ts) => {
      if (data) { state = initState(data); state.ui.welcomed = true; lastBackup = ts || null; }
      save(); applyAppearance(); render();
    });
  } else render();
})();
</script>

</body>
</html>
